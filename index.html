<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Metas — Fiscaltech 2026</title>
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('pm_theme') || 'dark');
</script>
<style>
  :root{
    --bg:#070d24;
    --panel:#0b1533;
    --panel-2:#0e1a3d;
    --line:#1c2c5a;
    --line-soft:#152245;
    --ink:#e8edff;
    --ink-dim:#8a97c4;
    --ink-faint:#5a6796;
    --accent:#3b82f6;
    /* níveis N1 (pior) -> N4 (melhor), mesma paleta do Cronograma */
    --n1:#ef4444; --n2:#f59e0b; --n3:#22c55e; --n4:#16a34a;
  }
  :root[data-theme="light"]{
    --bg:#eef1f7;
    --panel:#ffffff;
    --panel-2:#f3f6fb;
    --line:#c3cbdc;
    --line-soft:#d7dee9;
    --ink:#12151e;
    --ink-dim:#5a6478;
    --ink-faint:#7d8699;
    --accent:#2f5fd0;
    --n1:#c81e1e; --n2:#a3450a; --n3:#15803d; --n4:#166534;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, color-mix(in srgb, var(--accent) 18%, transparent) 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 0%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:13px;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;min-height:100vh}

  /* ---------- Sidebar ---------- */
  .side{
    width:230px;flex-shrink:0;
    background:linear-gradient(180deg,var(--panel) 0%,var(--bg) 100%);
    border-right:1px solid var(--line);
    padding:18px 14px;
    display:flex;flex-direction:column;gap:4px;
  }
  .side{transition:width .18s ease, padding .18s ease}
  .side.collapsed{width:72px;padding:18px 10px}
  .brand{display:flex;align-items:center;gap:8px;padding:6px 8px 18px}
  .side.collapsed .brand{padding:6px 0 18px;justify-content:center}
  .brand-text{min-width:0}
  .side.collapsed .brand-text{display:none}
  .brand b{font-size:15px;letter-spacing:.2px;display:block}
  .brand .brand-sub{font-size:9.5px;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;margin-top:1px;white-space:nowrap}
  .side-toggle{
    margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:7px;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-dim);cursor:pointer;flex-shrink:0;
  }
  .side-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .side-toggle svg{width:14px;height:14px;transition:transform .18s}
  .side.collapsed .side-toggle svg{transform:rotate(180deg)}
  .side .cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);padding:14px 8px 6px;white-space:nowrap}
  .side.collapsed .cap{opacity:0;height:0;padding:6px 0 0;overflow:hidden}
  .nav{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:9px;color:var(--ink-dim);
    cursor:pointer;user-select:none;transition:.15s;
    border:1px solid transparent;
  }
  .side.collapsed .nav{justify-content:center;padding:9px}
  .nav svg{width:16px;height:16px;flex-shrink:0}
  .nav .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side.collapsed .nav .label,
  .side.collapsed .nav .dot{display:none}
  .nav:hover{background:var(--panel-2);color:var(--ink)}
  .nav.active{background:var(--panel-2);color:var(--ink);border-color:var(--line)}
  .nav.active .dot{background:var(--n4)}
  .nav .dot{width:6px;height:6px;border-radius:50%;background:transparent;margin-left:auto;flex-shrink:0}
  .nav.ext{margin-top:2px}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:22px 26px 40px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#e07b4a;font-weight:600}
  h1{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
  .controls{display:flex;align-items:center;gap:8px}
  .pill{
    display:flex;align-items:center;gap:7px;
    background:var(--panel);border:1px solid var(--line);
    padding:8px 12px;border-radius:9px;color:var(--ink-dim);font-size:12px;
  }
  .pill svg{width:14px;height:14px}
  .theme-toggle{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-dim);
  }
  .theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .theme-toggle svg{width:16px;height:16px}
  :root[data-theme="light"] .theme-toggle .icon-moon,
  :root:not([data-theme="light"]) .theme-toggle .icon-sun{display:none}

  /* ---------- Summary cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:22px}
  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;
    position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar,var(--accent))}
  .card .lbl{font-size:11px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
  .card .lbl svg{width:13px;height:13px}
  .card .val{font-size:24px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .card .sub{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
  .tier-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:9px;color:#fff}

  /* ---------- Table ---------- */
  .tablewrap{
    background:var(--panel);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;
  }
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:900px}
  thead th{
    background:var(--panel-2);
    position:sticky;top:0;z-index:2;
    font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-dim);text-align:center;padding:12px 8px;
    border-bottom:1px solid var(--line);white-space:nowrap;
  }
  thead th.name{text-align:left;padding-left:18px;min-width:260px}
  tbody td{
    padding:9px 8px;text-align:center;font-variant-numeric:tabular-nums;
    border-bottom:1px solid var(--line-soft);white-space:nowrap;
  }
  tbody td.name{text-align:left;padding-left:18px;color:var(--ink)}
  .kpi-name{color:var(--ink-dim);font-size:12.5px;padding-left:20px !important;position:relative}
  .kpi-name::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:1px;background:var(--ink-faint)}

  tr.group td{
    background:var(--panel-2);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding-top:11px;padding-bottom:11px;
  }
  tr.group td.name{
    font-weight:700;color:var(--ink);font-size:13.5px;
    border-left:3px solid var(--areacolor,var(--accent));
    display:flex;align-items:center;gap:9px;
  }
  tr.group td.name svg{width:15px;height:15px;color:var(--areacolor,var(--accent))}
  .num{color:var(--ink);font-weight:600}
  .num.dim{color:var(--ink-dim);font-weight:500}
  .desemp{font-weight:700}
  .pend-tag{margin-left:8px;font-size:9.5px;color:var(--ink-faint);border:1px solid var(--line);padding:1px 6px;border-radius:20px}

  .cell{
    display:inline-block;min-width:46px;padding:4px 6px;border-radius:6px;
    font-size:11.5px;font-weight:600;color:#fff;
  }
  .cell.empty{background:transparent;color:var(--ink-faint);font-weight:500}
  tr.group .cell{font-weight:700}

  .foot{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:14px 18px;color:var(--ink-faint);font-size:11px;border-top:1px solid var(--line);
  }
  .legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend .lg{display:flex;align-items:center;gap:6px}
  .legend .sw{width:22px;height:11px;border-radius:3px}

  .foot-note{margin-top:16px;font-size:11px;color:var(--ink-faint);line-height:1.6}

  /* ---------- Area page (lançador de painéis) ---------- */
  .section-cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 10px}
  .dash-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .dash-card{
    display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:14px;padding:20px 22px;
    cursor:pointer;transition:.15s;
  }
  .dash-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .dash-card .ic{
    width:44px;height:44px;border-radius:11px;flex-shrink:0;
    background:color-mix(in srgb, var(--accent) 18%, transparent);
    display:grid;place-items:center;color:var(--accent);
  }
  .dash-card .ic svg{width:22px;height:22px}
  .dash-card .txt b{font-size:14.5px;display:block}
  .dash-card .txt span{font-size:11.5px;color:var(--ink-dim)}
  .empty-state{
    background:var(--panel);border:1px dashed var(--line);border-radius:14px;
    padding:32px 24px;text-align:center;color:var(--ink-faint);font-size:13px;
  }

  /* ---------- Dashboard de Manutenção Interna ---------- */
  .mi-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
  .mi-kpi{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  }
  .mi-kpi .lbl{font-size:11px;color:var(--ink-dim)}
  .mi-kpi .val{font-size:22px;font-weight:700;margin-top:8px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
  .mi-panels{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px}
  .mi-panels-2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
  @media(max-width:900px){ .mi-panels,.mi-panels-2{grid-template-columns:1fr} }
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  }
  .panel h3{font-size:12.5px;font-weight:700;color:var(--ink-dim);margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em}

  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
  .donut{width:130px;height:130px;border-radius:50%;flex-shrink:0;position:relative}
  .donut::after{content:"";position:absolute;inset:24%;border-radius:50%;background:var(--panel)}
  .donut-legend{display:flex;flex-direction:column;gap:8px}
  .donut-legend .lg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
  .donut-legend .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .donut-legend .pct{font-weight:700;margin-left:auto;padding-left:14px}

  .bars-mes{display:flex;align-items:flex-end;gap:10px;height:180px;overflow-x:auto;padding-top:8px}
  .bars-mes .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:34px;flex-shrink:0}
  .bars-mes .pair{display:flex;align-items:flex-end;gap:3px;height:100%}
  .bars-mes .bar{width:11px;border-radius:3px 3px 0 0}
  .bars-mes .bar.rec{background:var(--accent)}
  .bars-mes .bar.suc{background:transparent;border:1.5px solid var(--accent);opacity:.55}
  .bars-mes .mlabel{font-size:9.5px;color:var(--ink-faint);margin-top:6px;white-space:nowrap}
  .bars-legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--ink-dim)}
  .bars-legend .lg{display:flex;align-items:center;gap:6px}
  .bars-legend .sw{width:11px;height:11px;border-radius:3px}
  .bars-legend .sw.suc{background:transparent;border:1.5px solid var(--accent)}
  .bars-legend .sw.rec{background:var(--accent)}

  .funnel{display:flex;flex-direction:column;gap:10px}
  .funnel .row{display:flex;align-items:center;gap:10px}
  .funnel .flabel{width:120px;font-size:11.5px;color:var(--ink-dim);flex-shrink:0}
  .funnel .ftrack{flex:1;background:var(--panel-2);border-radius:5px;height:20px;overflow:hidden}
  .funnel .ffill{height:100%;background:var(--accent);border-radius:5px}
  .funnel .fval{width:60px;text-align:right;font-size:12px;font-weight:700;flex-shrink:0}

  .mi-loading{padding:40px 0;text-align:center;color:var(--ink-faint);font-size:13px}

  @media(max-width:900px){
    .side{display:none}
    .cards{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="side" id="sidebar">
    <div class="brand">
      <div class="brand-text">
        <b>Fiscaltech</b>
        <div class="brand-sub">Portal de Metas</div>
      </div>
      <button class="side-toggle" onclick="toggleSidebar()" title="Recolher/expandir menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <div class="cap">Painel</div>
    <div class="nav" data-view="geral" onclick="setView('geral')" title="Visão consolidada"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span class="label">Visão consolidada</span><span class="dot"></span></div>
    <div class="cap">Áreas</div>
    <div class="nav" data-view="Produção" onclick="setView('Produção')" title="Produção"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4v10.54a4 4 0 1 1-4 0V4"/><path d="M9 4h6"/></svg><span class="label">Produção</span></div>
    <div class="nav" data-view="Manutenção Interna" onclick="setView('Manutenção Interna')" title="Manutenção Interna"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.1 2.1-2-2 2.1-2.1z"/></svg><span class="label">Manutenção Interna</span></div>
    <div class="nav" data-view="Estoque" onclick="setView('Estoque')" title="Estoque"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8V5a1 1 0 0 0-.5-.87l-7.5-4.3a2 2 0 0 0-2 0L3.5 4.13A1 1 0 0 0 3 5v14a1 1 0 0 0 .5.87l7.5 4.3a2 2 0 0 0 2 0"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg><span class="label">Estoque</span></div>
    <div class="nav" data-view="Logística" onclick="setView('Logística')" title="Logística"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg><span class="label">Logística</span></div>
    <div class="cap">Painéis completos</div>
    <div class="nav ext" onclick="window.open('https://cronograma-producao-psi.vercel.app/','_blank')" title="Cronograma de Produção"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="label">Cronograma de Produção</span></div>
    <div class="nav ext" onclick="window.open('https://dash-producao-plum.vercel.app/','_blank')" title="Acompanhamento da Produção"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg><span class="label">Acompanhamento da Produção</span></div>
  </aside>

  <main class="main">
    <div id="view-root"></div>
  </main>
</div>

<script>
// ── TEMA ──
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur==='dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('pm_theme', next);
}

// ── SIDEBAR RECOLHER/EXPANDIR ──
let sidebarCollapsed = localStorage.getItem('pm_sidebar') === '1';
function toggleSidebar(){
  sidebarCollapsed = !sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', sidebarCollapsed);
  localStorage.setItem('pm_sidebar', sidebarCollapsed ? '1' : '0');
}

// ── NAVEGAÇÃO ENTRE TELAS: visão geral (todas as áreas) ou uma área específica ──
let currentView = 'geral';
function setView(view){
  currentView = view;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateSidebarActive(){
  document.querySelectorAll('.nav[data-view]').forEach(el=>{
    el.classList.toggle('active', el.dataset.view === currentView);
  });
}

/* =====================================================================
   MATRIZ DE METAS 2026 — cada "kpi" segue os N1-N4 oficiais.
   faixas = [limite N1→N2, limite N2→N3, limite N3→N4]
   sentido "maior" = quanto maior melhor · "menor" = quanto menor melhor
   meses = valores Jan..Dez
   ===================================================================== */
const METAS = [
  { area:"Produção", cor:"#3b82f6",
    kpis:[
      { id:"aderencia", nome:"Aderência à Programação", unidade:"%", sentido:"maior", faixas:[87,92,97], automatico:true, atual:null, meses:Array(12).fill(null),
        links:[
          {label:"Cronograma de Produção", url:"https://cronograma-producao-psi.vercel.app/"},
          {label:"Acompanhamento da Produção", url:"https://dash-producao-plum.vercel.app/"},
        ] },
    ]
  },
  { area:"Manutenção Interna", cor:"#f59e0b",
    kpis:[
      { id:"estoque-mi", nome:"Estoque Manutenção (R$)", unidade:"R$", sentido:"menor", faixas:[200000,250000,300000], automatico:true, atual:null, meses:Array(12).fill(null),
        links:[
          {label:"Planilha de Custos — Manutenção Interna", url:"https://docs.google.com/spreadsheets/d/1Ay7TR1AvRqBGNEoekNB-r2a42dWZjutLX2rS5afKTB4/edit"},
        ] },
    ]
  },
  { area:"Estoque", cor:"#22c55e",
    kpis:[
      { id:"acuracidade", nome:"Acuracidade do Estoque", unidade:"%", sentido:"maior", faixas:[94,97,98.5], automatico:false, atual:null, meses:Array(12).fill(null), links:[] },
      { id:"ruptura", nome:"Ruptura de Estoque (itens críticos)", unidade:"%", sentido:"menor", faixas:[2,3,5], automatico:false, atual:null, meses:Array(12).fill(null), links:[] },
    ]
  },
  { area:"Logística", cor:"#e07b4a",
    kpis:[
      { id:"sla", nome:"SLA de Atendimento", unidade:"%", sentido:"maior", faixas:[85,92,95], automatico:false, atual:null, meses:Array(12).fill(null), apenasIndicador:true, links:[] },
    ]
  },
];

const MESES_ORDEM = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

function nivel(valor, kpi){
  if(valor==null) return null;
  const [a,b,c] = kpi.faixas;
  if(kpi.sentido==="maior"){
    if(valor<a) return "n1"; if(valor<b) return "n2"; if(valor<c) return "n3"; return "n4";
  }
  if(valor>c) return "n1"; if(valor>b) return "n2"; if(valor>a) return "n3"; return "n4";
}
function corNivel(n){ return n ? `var(--${n})` : "transparent"; }
function fmt(v,un){
  if(v==null) return "–";
  if(un==="R$") return "R$ "+ Math.round(v/1000).toLocaleString("pt-BR")+"k";
  const n = (Math.round(v*10)/10).toLocaleString("pt-BR",{maximumFractionDigits:1});
  return un==="%" ? n+"%" : (un?n+" "+un:n);
}
function metaN4Texto(kpi){
  const c = kpi.faixas[2];
  return kpi.sentido==="maior" ? `≥ ${fmt(c,kpi.unidade)}` : `< ${fmt(c,kpi.unidade)}`;
}

/* =====================================================================
   ADERÊNCIA À PROGRAMAÇÃO — única fonte já conectada (planilha oficial
   FM.PRD.001, mesmo Apps Script de leitura usado no Cronograma).
   ===================================================================== */
const SOURCE_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzOktWtAdQ0Vg_tnqU2-WhgyMnX8J6ZL-Bq9GkDQxj-XQerBWK4qGiNkzv88sRLpvdV_g/exec';
const SEMANAS = Array.from({length:52}, (_,i) => 'S' + String(i+1).padStart(2,'0'));
// mês de cada semana, calculado a partir da data real (S01 começa 05/01/2026) — cobre o ano inteiro
const WEEK_MONTH = {};
SEMANAS.forEach((s,i)=>{ WEEK_MONTH[s] = MESES_ORDEM[new Date(2026,0,5 + i*7).getMonth()]; });

function semanaAtualNum(){
  const inicio = new Date(2026,0,5); // 05/01/2026 = início da S01
  const dias = Math.floor((new Date() - inicio)/86400000);
  return Math.min(52, Math.max(1, Math.floor(dias/7)+1));
}
function somarMetricas(...objs){
  const out={};
  objs.forEach(o=>Object.entries(o||{}).forEach(([k,v])=>{ if(v) out[k]=(out[k]||0)+v; }));
  return out;
}
function combinarPrevisto(m){ return somarMetricas(m['Prev'],m['Reprogramado'],m['Reprog.'],m['Reprog'],m['Não Prog.']); }
function combinarReal(m){ return somarMetricas(m['Real']); }

async function calcularAderenciaPrograma(){
  const res = await fetch(SOURCE_WEBAPP_URL+'?t='+Date.now());
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  const prevAno={}, realAno={};
  (data.projects||[]).forEach(p=>{
    const prod = combinarPrevisto(p.metrics||{});
    const real = combinarReal(p.metrics||{});
    Object.entries(prod).forEach(([s,v])=>{ prevAno[s]=(prevAno[s]||0)+v; });
    Object.entries(real).forEach(([s,v])=>{ realAno[s]=(realAno[s]||0)+v; });
  });

  const cutoff = semanaAtualNum()-1; // última semana já concluída
  let accPrev=0, accReal=0;
  const porMes = {};
  const semanaisAno = [];
  SEMANAS.forEach(s=>{
    accPrev += (prevAno[s]||0);
    accReal += (realAno[s]||0);
    const n = parseInt(s.slice(1),10);
    if(n>cutoff || accPrev<=0) return;
    const pct = accReal/accPrev*100;
    semanaisAno.push(pct);
    const mes = WEEK_MONTH[s];
    if(mes){ (porMes[mes] = porMes[mes]||[]).push(pct); }
  });

  const meses = MESES_ORDEM.map(m=>{
    const arr = porMes[m];
    return arr && arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  });
  const atual = semanaisAno.length ? semanaisAno.reduce((a,b)=>a+b,0)/semanaisAno.length : null;
  return { atual, meses, cutoff };
}

/* =====================================================================
   MANUTENÇÃO INTERNA — os dados vêm de um Apps Script Web App (mesmo
   padrão do Cronograma) que roda com a permissão do dono e lê por trás
   a planilha "Custos - Manutenção Interna 2026". Só o JSON agregado sai
   pra fora — a planilha em si pode ficar restrita, sem quebrar o Portal.
   ===================================================================== */
const MI_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1Ay7TR1AvRqBGNEoekNB-r2a42dWZjutLX2rS5afKTB4/edit';
const MI_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxWLJIvDG4l_9kLVx3BjJkxMgHlp9e7_Om1zvAdkiiaB-rkhONiHjpGt7as0Ip5Kdew/exec';

let dadosMI = null; // cache do resultado de calcularDadosMI(), preenchido no init()
let dadosMIPromise = null; // evita disparar duas buscas em paralelo (init + navegação do usuário)
function getDadosMI(){
  if(dadosMI) return Promise.resolve(dadosMI);
  if(!dadosMIPromise) dadosMIPromise = calcularDadosMI().then(d=>{ dadosMI = d; return d; });
  return dadosMIPromise;
}

async function calcularDadosMI(){
  const res = await fetch(MI_WEBAPP_URL+'?t='+Date.now());
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}

/* ---------------------------------------------------------------------
   RENDER
   --------------------------------------------------------------------- */
function mesCell(v, kpi){
  if(v==null) return `<td><span class="cell empty">–</span></td>`;
  const n = nivel(v,kpi);
  return `<td><span class="cell" style="background:${corNivel(n)}">${fmt(v,kpi.unidade)}</span></td>`;
}
function monthHeadCells(){ return MESES_ORDEM.map(m=>`<th>${m}</th>`).join(""); }
function kpiRowHTML(k, nested){
  const n = nivel(k.atual,k);
  return `<tr>
    <td class="name ${nested?'kpi-name':''}">${k.nome}${k.automatico?'':'<span class="pend-tag">pendente</span>'}</td>
    <td class="num dim">${metaN4Texto(k)}</td>
    <td class="num">${fmt(k.atual,k.unidade)}</td>
    <td class="desemp" style="color:${corNivel(n)}">${n?n.toUpperCase():'–'}</td>
    ${k.meses.map(m=>mesCell(m,k)).join("")}
  </tr>`;
}
function legendHTML(){
  return `<div class="legend">
    <span>Nível de atingimento da meta:</span>
    <span class="lg"><span class="sw" style="background:var(--n1)"></span>N1</span>
    <span class="lg"><span class="sw" style="background:var(--n2)"></span>N2</span>
    <span class="lg"><span class="sw" style="background:var(--n3)"></span>N3</span>
    <span class="lg"><span class="sw" style="background:var(--n4)"></span>N4</span>
  </div>`;
}
function topBarHTML(eyebrow, title, pillText){
  return `<div class="top">
    <div>
      <div class="eyebrow">${eyebrow}</div>
      <h1>${title}</h1>
    </div>
    <div class="controls">
      ${pillText?`<div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${pillText}</div>`:''}
      <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>`;
}
function setStamp(){
  const el = document.getElementById("stamp");
  if(el) el.textContent = "Atualizado em "+ new Date().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function rollupArea(grp){
  const niveis = grp.kpis.map(k=>nivel(k.atual,k)).filter(Boolean);
  const ordem = {n1:1,n2:2,n3:3,n4:4};
  const pior = niveis.length ? niveis.reduce((a,b)=> ordem[a]<=ordem[b]?a:b) : null;
  const kpiRef = grp.kpis.find(k=>nivel(k.atual,k)===pior) || grp.kpis[0];
  return {area:grp.area, cor:grp.cor, nivel:pior, kpiRef};
}

function render(){
  if(currentView === 'geral') viewGeral(); else viewArea(currentView);
  updateSidebarActive();
}

function viewGeral(){
  const resumoAreas = METAS.map(rollupArea);
  const rows = METAS.map(grp=>{
    const gtr = `<tr class="group" style="--areacolor:${grp.cor}">
      <td class="name">${areaIcon(grp.area)}${grp.area}</td>
      <td class="num dim">—</td><td class="num dim">—</td><td class="num dim">—</td>
      ${MESES_ORDEM.map(()=>`<td></td>`).join("")}
    </tr>`;
    return gtr + grp.kpis.map(k=>kpiRowHTML(k,true)).join("");
  }).join("");

  document.getElementById('view-root').innerHTML = `
    ${topBarHTML('Do planejamento à execução','Portal de Metas — Fiscaltech 2026','jan/2026 — dez/2026')}
    <div class="cards" id="cards"></div>
    <div class="tablewrap">
      <div class="scroll">
        <table>
          <thead><tr><th class="name">Meta</th><th>Meta (N4)</th><th>Atual</th><th>Nível</th>${monthHeadCells()}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="foot">${legendHTML()}<div id="stamp"></div></div>
    </div>
    <div class="foot-note">
      "Aderência à Programação" e "Estoque Manutenção (R$)" já buscam dado ao vivo direto das planilhas oficiais. Os demais indicadores da Matriz de Metas 2026 aparecem como <b>pendente</b> até a fonte de dados de cada área ser conectada da mesma forma. Os painéis completos de cada área ficam no menu à esquerda.
    </div>
  `;
  renderCards(resumoAreas);
  setStamp();
}

function viewArea(area){
  const grp = METAS.find(m=>m.area===area);
  if(!grp){ currentView='geral'; return viewGeral(); }

  if(area === 'Manutenção Interna') return viewManutencaoInterna(grp);

  const allLinks = grp.kpis.flatMap(k=>k.links||[]);
  const body = allLinks.length ? `
    <div class="section-cap">Painéis conectados</div>
    <div class="dash-links">
      ${allLinks.map(l=>`
        <div class="dash-card" onclick="window.open('${l.url}','_blank')">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></div>
          <div class="txt"><b>${l.label}</b><span>Abrir painel completo ↗</span></div>
        </div>
      `).join("")}
    </div>` : `<div class="empty-state">Nenhum painel conectado ainda para ${area}. O indicador mês a mês continua disponível na Visão consolidada.</div>`;

  document.getElementById('view-root').innerHTML = `
    ${topBarHTML('Painéis da área', area, null)}
    ${body}
  `;
}

/* ---------------------------------------------------------------------
   Dashboard de Manutenção Interna (reconstrução do painel Power BI)
   --------------------------------------------------------------------- */
function fmtGrande(v){
  if(v==null) return '–';
  if(Math.abs(v)>=1000000) return 'R$ '+(v/1000000).toLocaleString('pt-BR',{maximumFractionDigits:2})+' Mi';
  return 'R$ '+Math.round(v/1000).toLocaleString('pt-BR')+' Mil';
}
function donutHTML(nRec,nSuc,nEnv){
  const total = nRec+nSuc+nEnv || 1;
  const pRec = nRec/total*100, pSuc = nSuc/total*100, pEnv = nEnv/total*100;
  const c1 = pRec, c2 = c1+pSuc;
  return `<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(var(--accent) 0% ${c1}%, var(--n2) ${c1}% ${c2}%, var(--ink-faint) ${c2}% 100%)"></div>
    <div class="donut-legend">
      <div class="lg"><span class="sw" style="background:var(--accent)"></span>Peças Reparadas<span class="pct">${pRec.toFixed(0)}%</span></div>
      <div class="lg"><span class="sw" style="background:var(--n2)"></span>Peças Sucateadas<span class="pct">${pSuc.toFixed(0)}%</span></div>
      <div class="lg"><span class="sw" style="background:var(--ink-faint)"></span>Enviadas p/ Manut. Externa<span class="pct">${pEnv.toFixed(0)}%</span></div>
    </div>
  </div>`;
}
function barsMesHTML(serie){
  if(!serie.length) return '<div class="empty-state">Sem histórico mensal disponível.</div>';
  const max = Math.max(...serie.flatMap(m=>[m.rec,m.suc]), 1);
  const cols = serie.map(m=>`
    <div class="col">
      <div class="pair">
        <div class="bar rec" style="height:${Math.max(2,m.rec/max*100)}%" title="Recuperado: ${fmtGrande(m.rec)}"></div>
        <div class="bar suc" style="height:${Math.max(2,m.suc/max*100)}%" title="Sucateado: ${fmtGrande(m.suc)}"></div>
      </div>
      <div class="mlabel">${m.label}</div>
    </div>`).join("");
  return `<div class="bars-mes">${cols}</div>
    <div class="bars-legend">
      <span class="lg"><span class="sw rec"></span>Recuperado (R$)</span>
      <span class="lg"><span class="sw suc"></span>Sucateado (R$)</span>
    </div>`;
}
function funnelHTML(total,nRec,nSuc,nEnv){
  const rows = [
    {label:'Total avaliado', val: total},
    {label:'Reparadas', val: nRec},
    {label:'Sucateadas', val: nSuc},
    {label:'Enviadas MN', val: nEnv},
  ];
  return `<div class="funnel">${rows.map(r=>`
    <div class="row">
      <div class="flabel">${r.label}</div>
      <div class="ftrack"><div class="ffill" style="width:${total?(r.val/total*100):0}%"></div></div>
      <div class="fval">${r.val.toLocaleString('pt-BR')}</div>
    </div>`).join("")}</div>`;
}
function sparklineSVG(meses){
  const pts = meses.map((v,i)=>({i,v})).filter(p=>p.v!=null);
  if(!pts.length) return '<div class="empty-state">Ainda sem histórico mensal do saldo.</div>';
  const w=560,h=160,pad=28;
  const max = Math.max(...pts.map(p=>p.v))*1.15 || 1;
  const x = i => pad + (i/11)*(w-2*pad);
  const y = v => h-pad - (v/max)*(h-2*pad-14);
  const path = pts.map((p,idx)=>`${idx===0?'M':'L'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const dots = pts.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join('');
  const labels = MESES_ORDEM.map((m,i)=>`<text x="${x(i).toFixed(1)}" y="${h-6}" font-size="9.5" fill="var(--ink-faint)" text-anchor="middle">${m}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:180px">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
  </svg>`;
}
function miDashboardHTML(grp, d){
  const kpiEstoque = grp.kpis[0];
  const n = nivel(kpiEstoque.atual, kpiEstoque);
  return `
    <div class="mi-kpis">
      <div class="mi-kpi"><div class="lbl">Peças avaliadas</div><div class="val">${d.totalPecas.toLocaleString('pt-BR')}</div></div>
      <div class="mi-kpi"><div class="lbl">Índice de Recuperação (R$)</div><div class="val">${d.indiceRecuperacao!=null?d.indiceRecuperacao.toFixed(0)+'%':'–'}</div></div>
      <div class="mi-kpi"><div class="lbl">Valor Recuperado</div><div class="val">${fmtGrande(d.totRec)}</div></div>
      <div class="mi-kpi"><div class="lbl">Valor Sucateado</div><div class="val">${fmtGrande(d.totSuc)}</div></div>
      <div class="mi-kpi"><div class="lbl">Saldo Armazém MI</div><div class="val">${fmt(kpiEstoque.atual,'R$')}${n?` <span class="tier-badge" style="background:${corNivel(n)}">${n.toUpperCase()}</span>`:''}</div></div>
    </div>
    <div class="mi-panels">
      <div class="panel"><h3>Saldo Armazém MI (R$) — mês a mês, 2026</h3>${sparklineSVG(kpiEstoque.meses)}</div>
      <div class="panel"><h3>Destinação das peças</h3>${donutHTML(d.nRec,d.nSuc,d.nEnv)}</div>
    </div>
    <div class="mi-panels-2">
      <div class="panel"><h3>Peças recuperadas vs sucateadas (R$) — 2026</h3>${barsMesHTML(d.serieMensal)}</div>
      <div class="panel"><h3>Peças avaliadas por categoria</h3>${funnelHTML(d.totalPecas,d.nRec,d.nSuc,d.nEnv)}</div>
    </div>
    <div class="foot-note">Dados calculados ao vivo a partir das abas mensais da planilha "Custos - Manutenção Interna 2026" (peça a peça + saldo do armazém). <a href="${MI_SHEET_URL}" target="_blank" style="color:var(--accent)">Abrir planilha completa ↗</a></div>
  `;
}
function viewManutencaoInterna(grp){
  document.getElementById('view-root').innerHTML = `
    ${topBarHTML('Painéis da área', 'Manutenção Interna', null)}
    <div id="mi-dash">${dadosMI ? miDashboardHTML(grp, dadosMI) : '<div class="mi-loading">Carregando dados da Manutenção Interna…</div>'}</div>
  `;
  if(!dadosMI){
    getDadosMI().then(d=>{
      if(currentView === 'Manutenção Interna'){
        const el = document.getElementById('mi-dash');
        if(el) el.innerHTML = miDashboardHTML(grp, d);
      }
    }).catch(e=>{
      console.error('Erro ao buscar dados de Manutenção Interna:', e);
      const el = document.getElementById('mi-dash');
      if(el) el.innerHTML = '<div class="empty-state">Não foi possível carregar os dados agora. Tente novamente em instantes.</div>';
    });
  }
}

function renderCards(areas){
  const el = document.getElementById("cards");
  if(!el) return;
  el.innerHTML = areas.map(a=>`
    <div class="card" style="--bar:${a.cor}">
      <div class="lbl">${areaIcon(a.area,true)}${a.area}</div>
      <div class="val">
        ${a.nivel ? `${fmt(a.kpiRef.atual,a.kpiRef.unidade)} <span class="tier-badge" style="background:${corNivel(a.nivel)}">${a.nivel.toUpperCase()}</span>` : `<span style="font-size:14px;color:var(--ink-faint);font-weight:500">Pendente</span>`}
      </div>
      <div class="sub">${a.nivel ? a.kpiRef.nome : 'nenhum indicador conectado ainda'}</div>
    </div>
  `).join("");
}

function areaIcon(area,small){
  const s = small?'width="13" height="13"':'width="15" height="15"';
  const map={
    "Produção":`<path d="M14 4v10.54a4 4 0 1 1-4 0V4"/><path d="M9 4h6"/>`,
    "Manutenção Interna":`<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.1 2.1-2-2 2.1-2.1z"/>`,
    "Estoque":`<path d="M21 8V5l-9-4-9 4v14l9 4 9-4"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>`,
    "Logística":`<path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>`,
  };
  return `<svg viewBox="0 0 24 24" ${s} fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px">${map[area]||""}</svg>`;
}

async function init(){
  if(sidebarCollapsed) document.getElementById('sidebar').classList.add('collapsed');
  render(); // primeiro render com tudo pendente, pra tela não ficar em branco

  calcularAderenciaPrograma().then(({atual,meses})=>{
    const kpi = METAS[0].kpis[0];
    kpi.atual = atual;
    kpi.meses = meses;
    render();
  }).catch(e=>console.error('Erro ao buscar Aderência à Programação:', e));

  getDadosMI().then(d=>{
    const kpi = METAS[1].kpis[0];
    kpi.atual = d.estoque.atual;
    kpi.meses = d.estoque.meses;
    render();
  }).catch(e=>console.error('Erro ao buscar dados de Manutenção Interna:', e));
}
init();
</script>
