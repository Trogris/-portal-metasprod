<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Metas — Fiscaltech 2026</title>
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('pm_theme') || 'dark');
</script>
<style>
  :root{
    --bg:#070d24;
    --panel:#0b1533;
    --panel-2:#0e1a3d;
    --line:#1c2c5a;
    --line-soft:#152245;
    --ink:#e8edff;
    --ink-dim:#8a97c4;
    --ink-faint:#5a6796;
    --accent:#3b82f6;
    /* níveis N1 (pior) -> N4 (melhor) — tons vivos de vermelho/laranja/verde, pra contrastar no fundo escuro */
    --n1:#ff4757; --n2:#ffa502; --n3:#7bed9f; --n4:#2ed573;
  }
  :root[data-theme="light"]{
    --bg:#eef1f7;
    --panel:#ffffff;
    --panel-2:#f3f6fb;
    --line:#c3cbdc;
    --line-soft:#d7dee9;
    --ink:#12151e;
    --ink-dim:#5a6478;
    --ink-faint:#7d8699;
    --accent:#2f5fd0;
    --n1:#c81e1e; --n2:#a3450a; --n3:#15803d; --n4:#166534;
  }
  /* Visão Consolidada: badge com número branco em cima do verde — precisa de um verde mais
     escuro que o padrão (usado nos gráficos das áreas) pra não lavar o contraste do texto. */
  .geral-view{ --n3:#2bbd72; --n4:#1c9550; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, color-mix(in srgb, var(--accent) 18%, transparent) 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 0%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:13px;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;min-height:100vh}

  /* ---------- Sidebar ---------- */
  .side{
    width:230px;flex-shrink:0;
    background:linear-gradient(180deg,var(--panel) 0%,var(--bg) 100%);
    border-right:1px solid var(--line);
    padding:18px 14px;
    display:flex;flex-direction:column;gap:4px;
  }
  .side{transition:width .18s ease, padding .18s ease}
  .side.collapsed{width:72px;padding:18px 10px}
  .brand{display:flex;align-items:center;gap:8px;padding:6px 8px 18px}
  .side.collapsed .brand{padding:6px 0 18px;justify-content:center}
  .brand-text{min-width:0}
  .side.collapsed .brand-text{display:none}
  .brand b{font-size:15px;letter-spacing:.2px;display:block}
  .brand .brand-sub{font-size:9.5px;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;margin-top:1px;white-space:nowrap}
  .side-toggle{
    margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:7px;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-dim);cursor:pointer;flex-shrink:0;
  }
  .side-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .side-toggle svg{width:14px;height:14px;transition:transform .18s}
  .side.collapsed .side-toggle svg{transform:rotate(180deg)}
  .side .cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);padding:14px 8px 6px;white-space:nowrap}
  .side.collapsed .cap{opacity:0;height:0;padding:6px 0 0;overflow:hidden}
  .side .cap.toggle{display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;padding-right:10px;border-radius:6px}
  .side .cap.toggle:hover{color:var(--ink-dim)}
  .side .cap.toggle svg{width:11px;height:11px;flex-shrink:0;transition:transform .18s}
  .side .cap.toggle.open svg{transform:rotate(180deg)}
  .paineis-list{overflow:hidden;max-height:0;transition:max-height .2s ease}
  .paineis-list.open{max-height:220px}
  .side.collapsed .paineis-list{max-height:220px}
  .areas-list{overflow:hidden;max-height:0;transition:max-height .2s ease}
  .areas-list.open{max-height:400px}
  .side.collapsed .areas-list{max-height:400px}
  .nav.ext.nav-loading{cursor:wait;opacity:.75}
  .nav{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:9px;color:var(--ink-dim);
    cursor:pointer;user-select:none;transition:.15s;
    border:1px solid transparent;
  }
  .side.collapsed .nav{justify-content:center;padding:9px}
  .nav svg{width:16px;height:16px;flex-shrink:0}
  .nav .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side.collapsed .nav .label,
  .side.collapsed .nav .dot{display:none}
  .nav:hover{background:var(--panel-2);color:var(--ink)}
  .nav.active{background:var(--panel-2);color:var(--ink);border-color:var(--line)}
  .nav.active .dot{background:var(--n4)}
  .nav .dot{width:6px;height:6px;border-radius:50%;background:transparent;margin-left:auto;flex-shrink:0}
  .nav.ext{margin-top:2px}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:22px 26px 40px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#e07b4a;font-weight:600}
  h1{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
  .controls{display:flex;align-items:center;gap:8px}
  .pill{
    display:flex;align-items:center;gap:7px;
    background:var(--panel);border:1px solid var(--line);
    padding:8px 12px;border-radius:9px;color:var(--ink-dim);font-size:12px;
  }
  .pill svg{width:14px;height:14px}
  .pill.filtro-mes{padding-right:8px;cursor:pointer}
  .pill.filtro-mes svg{color:var(--accent)}
  .pill.filtro-mes select{
    background:transparent;border:none;color:var(--ink);font-size:12px;font-weight:600;
    cursor:pointer;outline:none;font-family:inherit;
  }
  .pill.filtro-mes select option{background:var(--panel);color:var(--ink)}
  .theme-toggle{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-dim);
  }
  .theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .theme-toggle svg{width:16px;height:16px}
  :root[data-theme="light"] .theme-toggle .icon-moon,
  :root:not([data-theme="light"]) .theme-toggle .icon-sun{display:none}

  /* ---------- Summary cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:22px}
  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;
    position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar,var(--accent))}
  .card .lbl{font-size:11px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
  .card .lbl svg{width:13px;height:13px}
  .card .val{font-size:24px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .card .sub{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
  .tier-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:9px;color:#fff}

  /* ---------- Destaque do último resultado nos gráficos (anel pulsante) ---------- */
  @keyframes pulseRing{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.9);opacity:0}}
  .pulse-ring{transform-box:fill-box;transform-origin:center;animation:pulseRing 1.7s ease-out infinite}

  /* ---------- Card "carregando" enquanto busca a planilha ---------- */
  @keyframes spin{to{transform:rotate(360deg)}}
  .card-spinner{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:7px}

  /* ---------- Table ---------- */
  .tablewrap{
    background:var(--panel);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;
  }
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:900px}
  thead th{
    background:var(--panel-2);
    position:sticky;top:0;z-index:2;
    font-size:11.5px;font-weight:600;
    color:var(--ink-dim);text-align:center;padding:12px 8px;
    border-bottom:1px solid var(--line);white-space:nowrap;
  }
  thead th.name{text-align:left;padding-left:18px;min-width:260px}
  tbody td{
    padding:9px 8px;text-align:center;font-variant-numeric:tabular-nums;
    border-bottom:1px solid var(--line-soft);white-space:nowrap;
  }
  tbody td.name{text-align:left;padding-left:18px;color:var(--ink)}
  .kpi-name{color:var(--ink-dim);font-size:12.5px;padding-left:20px !important;position:relative}
  .kpi-name::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:1px;background:var(--ink-faint)}

  tr.group td{
    background:var(--panel-2);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding-top:11px;padding-bottom:11px;
  }
  tr.group td.name{
    font-weight:700;color:var(--ink);font-size:13.5px;
    border-left:3px solid var(--areacolor,var(--accent));
    display:flex;align-items:center;gap:9px;
  }
  tr.group td.name svg{width:15px;height:15px;color:var(--areacolor,var(--accent))}
  .num{color:var(--ink);font-weight:600}
  .num.dim{color:var(--ink-dim);font-weight:500}
  .plano-input{background:transparent;border:none;border-bottom:1px dashed var(--line);color:var(--ink);font:inherit;font-size:11.5px;width:100%;min-width:80px;padding:3px 2px;text-align:center;border-radius:0;transition:outline .15s}
  .plano-input:focus{outline:none;border-bottom-color:var(--accent)}
  .plano-input::placeholder{color:var(--ink-faint)}
  /* Responsável: textarea que quebra linha e mostra o nome completo, sem cara de campo de texto */
  textarea.plano-input{text-align:left;white-space:pre-wrap;resize:vertical;min-height:34px;line-height:1.35;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--panel-2)}
  .plano-select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:inherit;font-size:11px;font-weight:600;padding:4px 6px;cursor:pointer;transition:outline .15s}
  .plano-select option{color:#0b1533;background:#fff}
  .desemp{font-weight:700}
  .pend-tag{margin-left:8px;font-size:9.5px;color:var(--ink-faint);border:1px solid var(--line);padding:1px 6px;border-radius:20px}

  .cell{
    display:inline-block;min-width:46px;padding:4px 6px;border-radius:6px;
    font-size:11.5px;font-weight:600;color:#fff;
  }
  .cell.empty{background:transparent;color:var(--ink-faint);font-weight:500}
  tr.group .cell{font-weight:700}
  th.th-active{color:var(--accent);background:color-mix(in srgb, var(--accent) 22%, var(--panel-2))}
  td.col-active{background:color-mix(in srgb, var(--accent) 14%, transparent)}
  tr.group td.col-active{background:color-mix(in srgb, var(--accent) 22%, var(--panel-2))}
  .cell.cell-active{box-shadow:0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, white 10%)}

  .foot{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:14px 18px;color:var(--ink-faint);font-size:11px;border-top:1px solid var(--line);
  }
  .legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend .lg{display:flex;align-items:center;gap:6px}
  .legend .sw{width:22px;height:11px;border-radius:3px}

  .foot-note{margin-top:16px;font-size:11px;color:var(--ink-faint);line-height:1.6}

  /* ---------- Area page (lançador de painéis) ---------- */
  .section-cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 10px}
  .dash-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .dash-card{
    display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:14px;padding:20px 22px;
    cursor:pointer;transition:.15s;
  }
  .dash-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .dash-card .ic{
    width:44px;height:44px;border-radius:11px;flex-shrink:0;
    background:color-mix(in srgb, var(--accent) 18%, transparent);
    display:grid;place-items:center;color:var(--accent);
  }
  .dash-card .ic svg{width:22px;height:22px}
  .dash-card .txt b{font-size:14.5px;display:block}
  .dash-card .txt span{font-size:11.5px;color:var(--ink-dim)}
  .empty-state{
    background:var(--panel);border:1px dashed var(--line);border-radius:14px;
    padding:32px 24px;text-align:center;color:var(--ink-faint);font-size:13px;
  }

  /* ---------- Dashboard de Manutenção Interna ---------- */
  .mi-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
  .mi-panels-3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}
  @media(max-width:1100px){ .mi-panels-3{grid-template-columns:1fr} }
  .semaforo-bar{height:14px;border-radius:7px;overflow:hidden;background:var(--line-soft)}
  .insight-card{
    display:flex;gap:12px;align-items:flex-start;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-left:3px solid var(--bar,var(--accent));
    border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:12.5px;color:var(--ink-dim);line-height:1.55;
  }
  .insight-card svg{width:18px;height:18px;color:var(--bar,var(--accent));flex-shrink:0;margin-top:1px}
  .insight-card b{color:var(--ink)}
  .mi-kpi{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:12px;padding:15px 16px;
    position:relative;overflow:hidden;
  }
  .mi-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar,var(--accent))}
  .mi-kpi .lbl{font-size:11px;color:var(--ink-dim);display:flex;align-items:center;gap:7px}
  .mi-kpi .lbl svg{width:14px;height:14px;color:var(--bar,var(--accent));flex-shrink:0}
  .mi-kpi .val{font-size:23px;font-weight:700;margin-top:9px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
  .mi-panels{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px}
  .mi-panels-2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
  @media(max-width:900px){ .mi-panels,.mi-panels-2{grid-template-columns:1fr} }
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
    cursor:pointer;transition:border-color .15s, grid-column .15s;
  }
  .panel:hover{border-color:var(--accent)}
  .panel.expanded{grid-column:1 / -1}
  .panel h3{
    font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:14px;
    display:flex;align-items:center;gap:8px;letter-spacing:-.01em;
  }
  .panel h3 svg{width:15px;height:15px;color:var(--accent);flex-shrink:0}
  .panel h3 .expand-ic{width:13px;height:13px;color:var(--ink-faint);margin-left:auto;transition:transform .18s}
  .panel.expanded h3 .expand-ic{transform:rotate(180deg)}
  .panel.expanded .bars-mes{height:300px}
  .panel.expanded .donut,.panel.expanded .donut::after{transition:.15s}
  .panel.expanded .donut{width:190px;height:190px}
  .panel.expanded .donut-wrap{gap:34px}
  .panel.expanded .funnel .ftrack{height:26px}

  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
  .donut{width:140px;height:140px;border-radius:50%;flex-shrink:0;position:relative}
  .donut::after{content:"";position:absolute;inset:24%;border-radius:50%;background:var(--panel)}
  .donut .d-center{
    position:absolute;inset:24%;display:grid;place-items:center;text-align:center;
  }
  .donut .d-center b{font-size:19px;font-weight:700;display:block;line-height:1.1;letter-spacing:-.02em}
  .donut .d-center span{font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
  .donut-legend{display:flex;flex-direction:column;gap:8px}
  .donut-legend .lg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
  .donut-legend .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .donut-legend .pct{font-weight:700;margin-left:auto;padding-left:14px}

  .bars-mes{display:flex;align-items:flex-end;gap:10px;height:180px;overflow-x:auto;padding-top:8px}
  .bars-mes .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:34px;flex-shrink:0}
  .bars-mes .pair{display:flex;align-items:flex-end;gap:3px;height:100%}
  .bars-mes .bar{width:11px;border-radius:4px 4px 0 0;transition:opacity .15s}
  .bars-mes .bar.rec{background:linear-gradient(180deg, color-mix(in srgb, var(--n4) 85%, white 15%), var(--n4) 55%, color-mix(in srgb, var(--n4) 70%, black 15%))}
  .bars-mes .bar.suc{background:linear-gradient(180deg, color-mix(in srgb, var(--n1) 85%, white 15%), var(--n1) 55%, color-mix(in srgb, var(--n1) 70%, black 15%));opacity:.85}
  .bars-mes .col:hover .bar{opacity:.75}
  .bars-mes .mlabel{font-size:9.5px;color:var(--ink-faint);margin-top:6px;white-space:nowrap}
  .bars-legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--ink-dim)}
  .bars-legend .lg{display:flex;align-items:center;gap:6px}
  .bars-legend .sw{width:11px;height:11px;border-radius:3px}
  .bars-legend .sw.suc{background:var(--n1)}
  .bars-legend .sw.rec{background:var(--n4)}

  .funnel{display:flex;flex-direction:column;gap:10px}
  .funnel .row{display:flex;align-items:center;gap:10px}
  .funnel .flabel{width:120px;font-size:11.5px;color:var(--ink-dim);flex-shrink:0}
  .funnel .ftrack{flex:1;background:var(--panel-2);border-radius:5px;height:20px;overflow:hidden}
  .funnel .ffill{height:100%;border-radius:5px;background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, black 10%), var(--accent))}
  .funnel .fval{width:60px;text-align:right;font-size:12px;font-weight:700;flex-shrink:0}

  .mi-loading{padding:40px 0;text-align:center;color:var(--ink-faint);font-size:13px}

  /* ---------- Mapa do Brasil (Filiais) ---------- */
  .mapbox{position:relative}
  #brmap{width:100%;height:auto;display:block}
  #brmap path.uf{stroke:var(--panel);stroke-width:1;transition:filter .15s;cursor:default}
  #brmap path.uf.hasbase{cursor:pointer}
  #brmap path.uf.hasbase:hover{filter:brightness(1.25)}
  #brmap .mk{fill:#fff;stroke:var(--bg);stroke-width:1}
  #brmap .mklbl{fill:var(--ink);font-size:9px;font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:2.4px}
  .map-tip{
    position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;font-size:11.5px;opacity:0;transition:opacity .12s;z-index:5;min-width:150px;
  }
  .map-tip b{display:block;font-size:12.5px;margin-bottom:4px}
  .map-tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink-dim);margin-top:2px}

  /* ---------- Seções numeradas (Estoque) ---------- */
  .sec-head{display:flex;align-items:center;gap:10px;margin:28px 0 14px}
  .sec-n{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#04160c;flex-shrink:0}
  .sec-head h2{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .sec-d{font-size:11.5px;color:var(--ink-dim);margin-left:2px}
  hr.sec-sep{border:none;border-top:1px solid var(--line);margin:26px 0 0}

  @media(max-width:900px){
    .side{display:none}
    .cards{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="side" id="sidebar">
    <div class="brand">
      <div class="brand-text">
        <b>Fiscaltech</b>
        <div class="brand-sub">Portal de Metas</div>
      </div>
      <button class="side-toggle" onclick="toggleSidebar()" title="Recolher/expandir menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>

const METAS = [

        links:[
          {label:"Planilha de Custos — Manutenção Interna", url:"https://docs.google.com/spreadsheets/d/1Ay7TR1AvRqBGNEoekNB-r2a42dWZjutLX2rS5afKTB4/edit"},
        ] },
    ]

  { area:"Estoque", cor:"#8b5cf6",
    kpis:[
      { id:"acuracidade", nome:"Acuracidade do Estoque", unidade:"%", sentido:"maior", faixas:[94,97,98.5], automatico:true, atual:null, meses:Array(12).fill(null), links:[] },
    ]

    kpis:[
      { id:"ruptura", nome:"Ruptura de Estoque (itens críticos)", unidade:"%", sentido:"menor", faixas:[2,3,5], automatico:true, atual:null, meses:Array(12).fill(null), links:[] },
    ]

const MESES_ORDEM = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

function nivel(valor, kpi){
  if(valor==null) return null;
  const [a,b,c] = kpi.faixas;
  if(kpi.sentido==="maior"){
    if(valor<a) return "n1"; if(valor<b) return "n2"; if(valor<c) return "n3"; return "n4";
  }
  if(valor>c) return "n1"; if(valor>b) return "n2"; if(valor>a) return "n3"; return "n4";
}
function corNivel(n){ return n ? `var(--${n})` : "transparent"; }
function fmt(v,un){
  if(v==null) return "–";
  if(un==="R$") return "R$ "+ Math.round(v/1000).toLocaleString("pt-BR")+"k";
  const n = (Math.round(v*10)/10).toLocaleString("pt-BR",{maximumFractionDigits:1});
  return un==="%" ? n+"%" : (un?n+" "+un:n);
}
function metaN4Texto(kpi){
  // alvo N4: faixas[2] quando maior é melhor (ex.: ≥97%), faixas[0] quando menor é melhor (ex.: < R$200k)
  return kpi.sentido==="maior" ? `≥ ${fmt(kpi.faixas[2],kpi.unidade)}` : `< ${fmt(kpi.faixas[0],kpi.unidade)}`;
}
function metaN4Valor(kpi){
  return kpi.sentido==="maior" ? kpi.faixas[2] : kpi.faixas[0];
}
// texto pra tooltip (title) explicando a faixa de cada nível N1-N4 desse indicador específico
function faixasTooltipTexto(kpi){
  const [a,b,c] = kpi.faixas;
  const u = kpi.unidade;
  if(kpi.sentido==="maior"){
    return `N1: < ${fmt(a,u)}\nN2: ${fmt(a,u)} a ${fmt(b,u)}\nN3: ${fmt(b,u)} a ${fmt(c,u)}\nN4: ≥ ${fmt(c,u)}`;
  }
  return `N1: > ${fmt(c,u)}\nN2: ${fmt(b,u)} a ${fmt(c,u)}\nN3: ${fmt(a,u)} a ${fmt(b,u)}\nN4: < ${fmt(a,u)}`;
}
function atingimento(valor, kpi){
  if(valor==null) return null;
  const meta = metaN4Valor(kpi);
  if(!meta) return null;
  return kpi.sentido==="maior" ? (valor/meta*100) : (meta/valor*100);
}

// ── FILTRO DE PERÍODO (Visão consolidada): null = valor mais recente/acumulado, 0-11 = um mês específico ──

  if(filtroMIDe!=null && (filtroMIAte==null || filtroMIAte<filtroMIDe)) filtroMIAte = filtroMIDe;
  if(filtroMIDe==null) filtroMIAte = null;

// pill com dois selects (De/Até) — de===null é "ano todo"; de===até é 1 mês só; de<até é um intervalo
function filtroPeriodoAreaHTML(idxsDisponiveis, de, ate, setDeFn, setAteFn){
  const optsDe = idxsDisponiveis.map(i=>`<option value="${i}" ${de===i?'selected':''}>${MESES_ORDEM[i]}/26</option>`).join("");
  const optsAte = idxsDisponiveis.filter(i=>de==null || i>=de).map(i=>`<option value="${i}" ${ate===i?'selected':''}>${MESES_ORDEM[i]}/26</option>`).join("");
  return `<div class="pill filtro-mes" style="margin-bottom:14px;gap:10px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
    <select onchange="${setDeFn}(this.value)">
      <option value="" ${de===null?'selected':''}>Ano todo</option>
      ${optsDe}
    </select>
    ${de!=null?`<span style="color:var(--ink-faint)">até</span><select onchange="${setAteFn}(this.value)">${optsAte}</select>`:''}
  </div>`;
}
function valorEfetivo(kpi){
  return filtroMes!=null ? kpi.meses[filtroMes] : kpi.atual;
}
// "Realizado" = média simples dos meses já postados no ano (soma / quantidade), não só o último mês
function mediaMeses(meses){
  const vals = (meses||[]).filter(v=>v!=null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

/* =====================================================================
   ADERÊNCIA À PROGRAMAÇÃO — única fonte já conectada (planilha oficial
   FM.PRD.001, mesmo Apps Script de leitura usado no Cronograma).
   ===================================================================== */
const SOURCE_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzOktWtAdQ0Vg_tnqU2-WhgyMnX8J6ZL-Bq9GkDQxj-XQerBWK4qGiNkzv88sRLpvdV_g/exec';
const SEMANAS = Array.from({length:52}, (_,i) => 'S' + String(i+1).padStart(2,'0'));
// mês de cada semana, calculado a partir da data real (S01 começa 05/01/2026) — cobre o ano inteiro
const WEEK_MONTH = {};
SEMANAS.forEach((s,i)=>{ WEEK_MONTH[s] = MESES_ORDEM[new Date(2026,0,5 + i*7).getMonth()]; });

function semanaAtualNum(){
  const inicio = new Date(2026,0,5); // 05/01/2026 = início da S01
  const dias = Math.floor((new Date() - inicio)/86400000);
  return Math.min(52, Math.max(1, Math.floor(dias/7)+1));
}
function somarMetricas(...objs){
  const out={};
  objs.forEach(o=>Object.entries(o||{}).forEach(([k,v])=>{ if(v) out[k]=(out[k]||0)+v; }));
  return out;
}
function combinarPrevisto(m){ return somarMetricas(m['Prev'],m['Reprogramado'],m['Reprog.'],m['Reprog'],m['Não Prog.']); }
function combinarReal(m){ return somarMetricas(m['Real']); }

// Busca com re-tentativa — o Apps Script do Cronograma às vezes devolve 404/500 transitório;
// tenta algumas vezes com uma pausinha antes de desistir, em vez de falhar de primeira.
async function fetchRetry(url, tentativas=3, esperaMs=700){
  let ultimoErro;
  for(let i=0;i<tentativas;i++){
    try{
      const res = await fetch(url, {cache:'no-store'});
      if(res.ok) return res;
      ultimoErro = new Error('HTTP '+res.status);
    }catch(e){ ultimoErro = e; }
    if(i<tentativas-1) await new Promise(r=>setTimeout(r, esperaMs*(i+1)));
  }
  throw ultimoErro;
}

async function calcularAderenciaPrograma(){
  // O Apps Script do Cronograma devolve 404/500 transitório com frequência;
  // insistimos mais vezes (6x, backoff crescente) pra não deixar o gráfico
  // preso em dado antigo/vazio quando o endpoint está instável.
  const res = await fetchRetry(SOURCE_WEBAPP_URL+'?t='+Date.now(), 6, 1000);
  const data = await res.json();
  const prevAno={}, realAno={};
  (data.projects||[]).forEach(p=>{
    const prod = combinarPrevisto(p.metrics||{});
    const real = combinarReal(p.metrics||{});
    Object.entries(prod).forEach(([s,v])=>{ prevAno[s]=(prevAno[s]||0)+v; });
    Object.entries(real).forEach(([s,v])=>{ realAno[s]=(realAno[s]||0)+v; });
  });

  const cutoff = semanaAtualNum()-1; // última semana já concluída

  const rankingProjetos = (data.projects||[]).map(p=>{
    const prod = combinarPrevisto(p.metrics||{});
    const real = combinarReal(p.metrics||{});
    let prev=0, rea=0;
    Object.entries(prod).forEach(([s,v])=>{ if(parseInt(s.slice(1),10)<=cutoff) prev+=v; });
    Object.entries(real).forEach(([s,v])=>{ if(parseInt(s.slice(1),10)<=cutoff) rea+=v; });
    return { nome:p.nome, previsto:prev, real:rea, pct: prev>0 ? rea/prev*100 : null };
  }).filter(p=>p.previsto>0).sort((a,b)=>a.pct-b.pct);

  let accPrev=0, accReal=0, totalProduzido=0, totalPrevisto=0;
  let picoSemana=null, picoValor=-1;
  const porMes = {};
  const porMesProd = {};
  const porMesPrev = {};
  const acumPrevMes = {};
  const acumRealMes = {};
  const acumPrevMesCompleto = {}; // previsto do ano inteiro (plano), sem corte na semana atual — pra mostrar até dezembro
  const semanaisAno = [];
  SEMANAS.forEach(s=>{
    accPrev += (prevAno[s]||0);
    accReal += (realAno[s]||0);
    const n = parseInt(s.slice(1),10);
    const mes = WEEK_MONTH[s];
    if(mes) acumPrevMesCompleto[mes] = accPrev;
    if(n>cutoff) return;
    totalProduzido += (realAno[s]||0);
    totalPrevisto += (prevAno[s]||0);
    if((realAno[s]||0) > picoValor){ picoValor = realAno[s]||0; picoSemana = s; }
    if(mes){
      porMesProd[mes] = (porMesProd[mes]||0) + (realAno[s]||0);
      porMesPrev[mes] = (porMesPrev[mes]||0) + (prevAno[s]||0);
      acumPrevMes[mes] = accPrev; // acumulado até a última semana daquele mês (dentro do corte)
      acumRealMes[mes] = accReal;
    }
    if(accPrev<=0) return;
    const pct = accReal/accPrev*100;
    semanaisAno.push(pct);
    if(mes){ (porMes[mes] = porMes[mes]||[]).push(pct); }
  });

  // Aderência de cada mês = média da razão ACUMULADA (desde jan) nas semanas daquele mês.
  // Testamos usar só Real/Prev do próprio mês, mas com denominadores pequenos por semana
  // isso gera índices absurdos (>150%) quando uma semana de poucos itens previstos tem
  // produção normal. A razão acumulada suaviza esse ruído e fica sempre plausível (<=100%).
  const meses = MESES_ORDEM.map(m=>{
    const arr = porMes[m];
    return arr && arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  });
  const producaoMensal = MESES_ORDEM.map(m => porMesProd[m]!=null ? porMesProd[m] : null);
  const previstoMensal = MESES_ORDEM.map(m => porMesPrev[m]!=null ? porMesPrev[m] : null);
  const previstoAcumMensal = MESES_ORDEM.map(m => acumPrevMes[m]!=null ? acumPrevMes[m] : null);
  const realizadoAcumMensal = MESES_ORDEM.map(m => acumRealMes[m]!=null ? acumRealMes[m] : null);
  const previstoAcumMensalCompleto = MESES_ORDEM.map(m => acumPrevMesCompleto[m]!=null ? acumPrevMesCompleto[m] : null);
  const atual = semanaisAno.length ? semanaisAno.reduce((a,b)=>a+b,0)/semanaisAno.length : null;

  // posição de "hoje" no eixo de meses (fracionária, ex.: 6.4 = um pouco depois do início de Jul)
  const wkAtual = semanaAtualNum();
  const mesAtualNome = WEEK_MONTH['S'+String(wkAtual).padStart(2,'0')];
  const mesAtualIdx = MESES_ORDEM.indexOf(mesAtualNome);
  let hojePos = mesAtualIdx;
  if(mesAtualIdx>=0){
    const semanasDoMes = SEMANAS.filter(s=>WEEK_MONTH[s]===mesAtualNome).map(s=>parseInt(s.slice(1),10));
    const primeira = Math.min(...semanasDoMes), ultima = Math.max(...semanasDoMes);

    hojePos = mesAtualIdx + frac;
  }

  return { atual, meses, cutoff, producaoMensal, previstoMensal, previstoAcumMensal, realizadoAcumMensal, previstoAcumMensalCompleto, hojePos, totalProduzido, totalPrevisto, rankingProjetos, picoSemana, picoValor };
}

let dadosMI = null; // cache do resultado de calcularDadosMI(), preenchido no init()
let dadosMIPromise = null; // evita disparar duas buscas em paralelo (init + navegação do usuário)
function getDadosMI(){
  if(dadosMI) return Promise.resolve(dadosMI);
  if(!dadosMIPromise) dadosMIPromise = calcularDadosMI().then(d=>{ dadosMI = d; return d; }).catch(e=>{ dadosMIPromise = null; throw e; });

}

async function calcularDadosMI(){
  const res = await fetch(MI_WEBAPP_URL+'?t='+Date.now());
  if(!res.ok) throw new Error('HTTP '+res.status);
  const d = await res.json();
  // quantidade de peças nunca é fracionada — R$ pode ter centavos, contagem não
  d.nRec = Math.round(d.nRec); d.nSuc = Math.round(d.nSuc); d.nEnv = Math.round(d.nEnv);
  d.totalPecas = d.nRec + d.nSuc + d.nEnv;
  return d;
}

function parseMesAbrevEstoque(f){
  const m = /^([a-zç]{3})\.?-(\d{2})$/i.exec(String(f||'').trim());
  return m ? (MES_ABREV_IDX_ESTOQUE[m[1].toLowerCase()] ?? null) : null;
}
async function calcularDadosEstoqueMatriz(){
  const json = await fetchGvizJSON(ESTOQUE_SHEET_ID, ESTOQUE_SHEET_ABA);
  const rows = (json.table.rows||[]).map(r=>r.c||[]);
  const meses = Array(12).fill(null);
  const vazio = { atual:null, meses, colunas:[] };
  if(!rows.length) return vazio;

  const headerRow = rows.find(r => r.slice(5,12).some(c => parseMesAbrevEstoque(c&&c.f)!=null));
  const resultRow = rows[rows.length-1]; // resultado final (%) sempre na última linha da aba
  if(!headerRow || !resultRow) return vazio;

  const numAt = (row,col) => row && row[col] && typeof row[col].v==='number' ? row[col].v : null;
  const rotulo = r => r && r[4] && r[4].v!=null ? String(r[4].v).trim() : null;

  const itensRow = rows.find(r => rotulo(r) === 'Qtde de itens contados');
  // cada seção (Qtde/Valor) segue o mesmo padrão de 5 linhas logo abaixo do cabeçalho:
  // Saldo sistêmico, Saldo Real, Saldo Divergente, % divergência, Peso.
  function acharSecao(labelSecao){
    const ini = rows.findIndex(r => rotulo(r) === labelSecao);
    if(ini<0) return null;
    return { sistemico: rows[ini+1], real: rows[ini+2], divergente: rows[ini+3], pctRow: rows[ini+4] };
  }
  const secQtde = acharSecao('Qtde');
  const secValor = acharSecao('Valor');

  const colunas = [];
  for(let col=5; col<=11; col++){
    const idx = parseMesAbrevEstoque(headerRow[col] && headerRow[col].f);
    if(idx==null) continue;
    const resultado = numAt(resultRow,col);
    if(resultado!=null) meses[idx] = resultado*100;
    const itensContados = itensRow ? numAt(itensRow,col) : null;
    if(itensContados==null && resultado==null) continue; // mês sem nenhum dado ainda
    colunas.push({
      idx, label: MESES_ORDEM[idx]+'/26',
      itensContados,
      qtde: secQtde ? { sistemico:numAt(secQtde.sistemico,col), real:numAt(secQtde.real,col), divergente:numAt(secQtde.divergente,col), pct:numAt(secQtde.pctRow,col) } : null,
      valor: secValor ? { sistemico:numAt(secValor.sistemico,col), real:numAt(secValor.real,col), divergente:numAt(secValor.divergente,col), pct:numAt(secValor.pctRow,col) } : null,
      resultado: resultado!=null ? resultado*100 : null,
    });
  }
  const preenchidos = meses.map((v,i)=>({v,i})).filter(x=>x.v!=null);
  const atual = preenchidos.length ? preenchidos[preenchidos.length-1].v : null;
  return { atual, meses, colunas };
}
let dadosEstoqueMatriz = null;
let dadosEstoqueMatrizPromise = null;
function getDadosEstoqueMatriz(){
  if(dadosEstoqueMatriz) return Promise.resolve(dadosEstoqueMatriz);
  if(!dadosEstoqueMatrizPromise) dadosEstoqueMatrizPromise = calcularDadosEstoqueMatriz().then(d=>{ dadosEstoqueMatriz = d; return d; }).catch(e=>{ dadosEstoqueMatrizPromise = null; throw e; });
  return dadosEstoqueMatrizPromise;
}
const BASE_UF = {
  'Base Paraíba':'PB', 'Base Goiânia':'GO', 'Base Brasília':'DF', 'Base Linhares':'ES',
  'Base Cuiabá':'MT', 'Base Campo Grande':'MS', 'Base Campinas':'SP',
  'Base Cascavel - Consórcio':'PR', 'Base Cascavel - EPR':'PR',
};
// Acuracidade por base é operacional (rede de filiais), não o KPI oficial "Acuracidade do
// Estoque" da Matriz de Metas (esse é medido no CD/Matriz — setor "Estoque" — fonte ainda
// pendente). Mesma faixa de classificação usada como referência visual do mapa/ranking.
const KPI_ACURACIDADE_FILIAL = {unidade:'%', sentido:'maior', faixas:[94,97,98.5]};

let dadosFiliais = null;
let dadosFiliaisPromise = null;
function getDadosFiliais(){
  if(dadosFiliais) return Promise.resolve(dadosFiliais);
  if(!dadosFiliaisPromise) dadosFiliaisPromise = calcularDadosFiliais().then(d=>{ dadosFiliais = d; return d; }).catch(e=>{ dadosFiliaisPromise = null; throw e; });
  return dadosFiliaisPromise;
}

async function fetchGvizJSON(sheetId, nomeAba){
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(nomeAba)}&t=${Date.now()}`;
  const res = await fetch(url, {cache:'no-store'});
  const text = await res.text();
  return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}')+1));
}

const MES_NOME_IDX_FILIAIS = {janeiro:0,fevereiro:1,'março':2,abril:3,maio:4,junho:5,julho:6,agosto:7,setembro:8,outubro:9,novembro:10,dezembro:11};
function parseMesAnoFiliais(s){
  const partes = String(s).toLowerCase().split('/');
  const idx = MES_NOME_IDX_FILIAIS[(partes[0]||'').trim()];
  if(idx==null) return null;
  const anoStr = (partes[1]||'').trim();
  const ano = anoStr ? (anoStr.length===2 ? 2000+parseInt(anoStr,10) : parseInt(anoStr,10)) : 0;
  return { idx, chave: ano*12+idx };
}

async function calcularDadosFiliais(){
  const [resumoJson, mensalJson] = await Promise.all([
    fetchGvizJSON(FILIAIS_SHEET_ID, 'Resumo por Base'),
    fetchGvizJSON(FILIAIS_SHEET_ID, 'Resumo Mensal'),
  ]);
  const numv = c => (c && typeof c.v === 'number') ? c.v : null;
  const strv = c => (c && c.v != null) ? String(c.v) : null;

  // "Resumo por Base": Base, % Atendimento, Ruptura %, Nível, SKUs na Meta, SKUs Total, Pendência Total.
  // É o estado ATUAL por base (atualizado ao vivo conforme pendências são resolvidas) — alimenta o
  // mapa, o ranking e a tabela por base (o "como está agora"). A aba "Resumo Mensal" é a MÉDIA fechada
  // do mês (calculada pelo script do usuário) — usada só para os cards de rede e o histórico mensal
  // (Matriz de Metas), que precisam de um número estável mês a mês, não um valor que muda a cada minuto.
  // O "Excesso" (aba "Excesso de Estoque") foi removido: comparava quantidade de itens por código contra
  // contagem de SKUs de outra aba — unidades diferentes, dava percentuais sem sentido (ex.: 360% numa base).
  const bases = [];
  (resumoJson.table.rows||[]).forEach(row=>{
    if(!row.c) return;
    const nome = strv(row.c[0]);
    if(!nome) return;
    const ns = numv(row.c[1]), rup = numv(row.c[2]);
    bases.push({ base: nome, uf: BASE_UF[nome]||null,
      ns: ns!=null ? ns*100 : null, rupturaBase: rup!=null ? rup*100 : null,
      skusMeta: numv(row.c[4])||0, objetivo: numv(row.c[5])||0, pend: numv(row.c[6])||0 });
  });

  // "Resumo Mensal": Mês, Base, % Atendimento (média), Ruptura % (média), Nível, Semanas
  const porMes = {}; // chave (ano*12+mês) -> { idx, porBase:{nome:{atendimento,ruptura}} }
  (mensalJson.table.rows||[]).forEach(row=>{
    if(!row.c) return;
    const mesStr = strv(row.c[0]), nome = strv(row.c[1]);
    if(!mesStr || !nome) return;
    const m = parseMesAnoFiliais(mesStr);
    if(!m) return;
    if(!porMes[m.chave]) porMes[m.chave] = { idx: m.idx, porBase:{} };
    porMes[m.chave].porBase[nome] = { atendimento: numv(row.c[2]), ruptura: numv(row.c[3]) };
  });
  const chaves = Object.keys(porMes).map(Number).sort((a,b)=>a-b);
  const chaveAtual = chaves.length ? chaves[chaves.length-1] : null;
  const mesAtualDados = chaveAtual!=null ? porMes[chaveAtual] : null;

  let totSkusMeta=0, totSkusTotal=0;
  bases.forEach(b=>{
    b.acuraciaBase = b.objetivo>0 ? b.skusMeta/b.objetivo*100 : null; // acuracidade de estoque (SKUs na Meta / SKUs Total), estado atual
    totSkusMeta += b.skusMeta; totSkusTotal += b.objetivo;
  });

  // série histórica real da rede (média simples entre bases, por mês) — alimenta o KPI oficial mês a mês
  const acuraciaMensal = Array(12).fill(null), rupturaMensal = Array(12).fill(null);
  chaves.forEach(ch=>{
    const vals = Object.values(porMes[ch].porBase);
    const atd = vals.map(v=>v.atendimento).filter(v=>v!=null);
    const rup = vals.map(v=>v.ruptura).filter(v=>v!=null);
    const idx = porMes[ch].idx;
    if(atd.length) acuraciaMensal[idx] = atd.reduce((a,b)=>a+b,0)/atd.length*100;
    if(rup.length) rupturaMensal[idx] = rup.reduce((a,b)=>a+b,0)/rup.length*100;
  });

  return {
    bases,
    acuracidade: mesAtualDados!=null ? acuraciaMensal[mesAtualDados.idx] : null,
    ruptura: mesAtualDados!=null ? rupturaMensal[mesAtualDados.idx] : null,
    acuraciaEstoque: totSkusTotal>0 ? totSkusMeta/totSkusTotal*100 : null, // SKUs na Meta / SKUs Total (rede), semana atual
    acuraciaMensal, rupturaMensal,
  };
}

  const n = nivel(v,kpi);
  return `<td${cls}><span class="cell" style="background:${corNivel(n)}">${fmt(v,kpi.unidade)}</span></td>`;

  const el = document.getElementById("stamp");

function rollupArea(grp){
  const niveis = grp.kpis.map(k=>nivel(valorEfetivo(k),k)).filter(Boolean);
  const ordem = {n1:1,n2:2,n3:3,n4:4};
  const pior = niveis.length ? niveis.reduce((a,b)=> ordem[a]<=ordem[b]?a:b) : null;
  const kpiRef = grp.kpis.find(k=>nivel(valorEfetivo(k),k)===pior) || grp.kpis[0];
  return {area:grp.area, cor:grp.cor, nivel:pior, kpiRef};
}

function viewArea(area){
  if(area === 'Estoque') return viewEstoqueMatriz(); // área operacional, sem KPI oficial atrelado na Matriz de Metas
  if(area === 'Logística') return viewLogisticaMatriz(); // KPI oficial (SLA) ainda pendente; página com modelo fictício de Custo por Rota
  if(area === 'Plano de Ação') return viewPlanoAcao(); // cross-área, sem KPI oficial atrelado na Matriz de Metas

  const grp = METAS.find(m=>m.area===area);
  if(!grp){ currentView='geral'; return viewGeral(); }

  if(area === 'Produção') return viewProducao(grp);
  if(area === 'Manutenção Interna') return viewManutencaoInterna(grp);
  if(area === 'Filiais') return viewFiliais(grp);

  const allLinks = grp.kpis.flatMap(k=>k.links||[]);
  const body = allLinks.length ? `
    <div class="section-cap">Painéis conectados</div>
    <div class="dash-links">
      ${allLinks.map(l=>`
        <div class="dash-card" onclick="window.open('${l.url}','_blank')">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></div>
          <div class="txt"><b>${l.label}</b><span>Abrir painel completo ↗</span></div>
        </div>
      `).join("")}
    </div>` : `<div class="empty-state">Nenhum painel conectado ainda para ${area}. O indicador mês a mês continua disponível na Visão consolidada.</div>`;

  document.getElementById('view-root').innerHTML = `
    ${topBarHTML('Painéis da área', area, null)}
    ${body}
  `;
}

  return 'R$ '+Math.round(v/1000).toLocaleString('pt-BR')+' Mil';
}

function sparklineSVG(kpi, opts){
  const o = Object.assign({ h:190, dotR:5, ringR:11, metaEsquerda:null, fontSize:9.5 }, opts);
  const pts = kpi.meses.map((v,i)=>({i,v})).filter(p=>p.v!=null);
  if(!pts.length) return '<div class="empty-state">Ainda sem histórico mensal do saldo.</div>';
  // meta começa do lado direito (início do ano, chart ainda vazio à direita) e passa pro
  // esquerdo conforme o ano avança, senão o rótulo fica encoberto pelo último ponto/linha
  if(o.metaEsquerda==null) o.metaEsquerda = pts[pts.length-1].i >= 6;
  const w=560,h=o.h,P={l:66,r:26,t:26,b:34};
  const vals = pts.map(p=>p.v);
  const meta = kpi.faixas ? metaN4Valor(kpi) : null;
  let lo = Math.min(...vals, ...(meta!=null?[meta]:[])), hi = Math.max(...vals, ...(meta!=null?[meta]:[]));
  const pad = (hi-lo)*0.3 || Math.max(hi*0.1,1);
  lo -= pad; hi += pad;
  if(kpi.unidade!=='%') lo = Math.max(0, lo); // dinheiro/quantidade não fica negativo
  const span = Math.max(1, pts.length-1); // espalha os pontos existentes por toda a largura, sem reservar espaço pros meses futuros
  const x = idx => P.l + (idx/span)*(w-P.l-P.r);
  const y = v => P.t + (hi-v)/((hi-lo)||1)*(h-P.t-P.b);

  let grid = '';
  for(let k=0;k<=3;k++){
    const v = lo + (hi-lo)*k/3;
    const yy = y(v);
    grid += `<line x1="${P.l}" y1="${yy.toFixed(1)}" x2="${w-P.r}" y2="${yy.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    grid += `<text x="${P.l-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" fill="var(--ink-faint)" font-size="${o.fontSize}">${fmt(v,kpi.unidade)}</text>`;
  }
  const labels = pts.map((p,idx)=>`<text x="${x(idx).toFixed(1)}" y="${h-10}" text-anchor="middle" fill="var(--ink-faint)" font-size="${o.fontSize}">${MESES_ORDEM[p.i]}</text>`).join('');

  const metaLine = meta!=null ? (()=>{
    const ym = y(meta);
    const mx = o.metaEsquerda ? P.l : w-P.r;
    const anchor = o.metaEsquerda ? 'start' : 'end';
    return `<line x1="${P.l}" y1="${ym.toFixed(1)}" x2="${w-P.r}" y2="${ym.toFixed(1)}" stroke="var(--n2)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".9"/>
      <text x="${mx.toFixed(1)}" y="${(ym-6).toFixed(1)}" text-anchor="${anchor}" fill="var(--n2)" font-size="${o.fontSize}" font-weight="600">Meta N4</text>`;
  })() : '';

  const path = pts.map((p,idx)=>`${idx===0?'M':'L'}${x(idx).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const areaBottom = (h-P.b).toFixed(1);
  const area = `${path} L${x(pts.length-1).toFixed(1)},${areaBottom} L${x(0).toFixed(1)},${areaBottom} Z`;

  const dots = pts.map((p,idx)=>{
    const nv = nivel(p.v,kpi);
    const isFirst = idx===0, isLast = idx===pts.length-1;
    const anchor = isFirst ? 'start' : isLast ? 'end' : 'middle';
    const lx = isFirst ? x(idx)+7 : isLast ? x(idx)-7 : x(idx);
    const ring = isLast ? `<circle class="pulse-ring" cx="${x(idx).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${o.ringR}" fill="none" stroke="var(--accent)" stroke-width="2"/>` : '';
    return `${ring}<circle cx="${x(idx).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${o.dotR}" fill="${corNivel(nv)}" stroke="var(--panel)" stroke-width="1.5"/>
      <text x="${lx.toFixed(1)}" y="${(y(p.v)-10).toFixed(1)}" text-anchor="${anchor}" fill="var(--ink)" font-size="${o.fontSize}" font-weight="600">${fmt(p.v,kpi.unidade)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="miGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".32"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#miGrad)"/>
    ${metaLine}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${labels}
  </svg>`;
}

/* ---------------------------------------------------------------------
   Dashboard de Produção (reconstrução do painel Power BI "Performance
   da Produção") — Total produzido, Aderência e ranking por projeto vêm
   da mesma planilha oficial já usada na Visão Geral.
   --------------------------------------------------------------------- */
function producaoStepSVG(qtyArr, pctArr, kpi){
  const idxs = [];
  for(let i=0;i<12;i++){ if(qtyArr[i]!=null || pctArr[i]!=null) idxs.push(i); }
  if(!idxs.length) return '<div class="empty-state">Ainda sem histórico mensal de produção.</div>';

  const w=1000,h=210,P={l:50,r:58,t:24,b:34};
  const span = Math.max(1, idxs.length-1);
  const x = pos => P.l + (pos/span)*(w-P.l-P.r);

  const qtyVals = idxs.map(i=>qtyArr[i]).filter(v=>v!=null);
  const maxQty = Math.max(...qtyVals, 1) * 1.25;
  const yQty = v => h-P.b - (v/maxQty)*(h-P.t-P.b);

  const meta = kpi.faixas ? metaN4Valor(kpi) : null;
  const pctVals = idxs.map(i=>pctArr[i]).filter(v=>v!=null);
  let loPct = Math.min(...(pctVals.length?pctVals:[70]), ...(meta!=null?[meta]:[])), hiPct = Math.max(...(pctVals.length?pctVals:[110]), ...(meta!=null?[meta]:[]));
  const padPct = (hiPct-loPct)*0.3 || 10;
  loPct -= padPct; hiPct += padPct;
  const yPct = v => P.t + (hiPct-v)/((hiPct-loPct)||1)*(h-P.t-P.b);
  const metaLine = meta!=null ? (()=>{
    const ym = yPct(meta);
    return `<line x1="${P.l}" y1="${ym.toFixed(1)}" x2="${w-P.r}" y2="${ym.toFixed(1)}" stroke="var(--n2)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".9"/>
      <text x="${P.l}" y="${(ym-6).toFixed(1)}" text-anchor="start" fill="var(--n2)" font-size="9.5" font-weight="600">Meta N4</text>`;
  })() : '';

  let grid = '';
  for(let k=0;k<=3;k++){
    const v = maxQty*k/3;
    const yy = yQty(v);
    grid += `<line x1="${P.l}" y1="${yy.toFixed(1)}" x2="${w-P.r}" y2="${yy.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    grid += `<text x="${P.l-18}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" fill="var(--ink-faint)" font-size="9.5">${Math.round(v)}</text>`;
  }
  let rightAxis = '';
  for(let k=0;k<=3;k++){
    const v = loPct + (hiPct-loPct)*k/3;
    const yy = yPct(v);
    rightAxis += `<text x="${w-P.r+18}" y="${(yy+3.5).toFixed(1)}" text-anchor="start" fill="var(--ink-faint)" font-size="9.5">${Math.round(v)}%</text>`;
  }

  const barW = Math.min(26, (w-P.l-P.r)/idxs.length*0.5);
  // rótulos do valor ficam centralizados em TODAS as barras (incl. 1ª/última — nada de
  // deslocar pro lado, senão o número fica desalinhado da barra) e são desenhados por
  // último (depois da linha/pontos de %), pra nunca ficar encoberto por eles.
  let bars = '', barLabels = '';
  idxs.forEach((mi,pos)=>{
    const v = qtyArr[mi];
    if(v==null) return;
    const bx = x(pos)-barW/2, by = yQty(v);
    bars += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${(h-P.b-by).toFixed(1)}" rx="3" fill="var(--accent)" opacity="0.85"/>`;
    barLabels += `<text x="${x(pos).toFixed(1)}" y="${(by-6).toFixed(1)}" text-anchor="middle" fill="var(--ink-dim)" font-size="9.5" paint-order="stroke" stroke="var(--panel)" stroke-width="3" stroke-linejoin="round">${Math.round(v)}</text>`;
  });

  // linha em escada: segura o valor anterior até o próximo mês, depois sobe/desce
  const linePts = idxs.map((mi,pos)=> pctArr[mi]!=null ? {pos,v:pctArr[mi]} : null).filter(Boolean);
  let stepPath = '';
  linePts.forEach((p,i)=>{
    const px = x(p.pos).toFixed(1), py = yPct(p.v).toFixed(1);
    if(i===0){ stepPath += `M${px},${py}`; }
    else{ stepPath += ` L${px},${yPct(linePts[i-1].v).toFixed(1)} L${px},${py}`; }
  });
  const lineDots = linePts.map((p,i)=>{
    const n = nivel(p.v, kpi);
    const isLast = i===linePts.length-1;
    const ring = isLast ? `<circle class="pulse-ring" cx="${x(p.pos).toFixed(1)}" cy="${yPct(p.v).toFixed(1)}" r="11" fill="none" stroke="var(--accent)" stroke-width="2"/>` : '';
    return `${ring}<circle cx="${x(p.pos).toFixed(1)}" cy="${yPct(p.v).toFixed(1)}" r="${isLast?5:3.5}" fill="${corNivel(n)}" stroke="var(--panel)" stroke-width="1.5"/>`;
  }).join('');

  const labels = idxs.map((mi,pos)=>{
    return `<text x="${x(pos).toFixed(1)}" y="${h-10}" text-anchor="middle" fill="var(--ink-faint)" font-size="9.5">${MESES_ORDEM[mi]}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    ${grid}${bars}
    ${metaLine}
    <path d="${stepPath}" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0.9"/>
    ${lineDots}${rightAxis}${labels}${barLabels}
  </svg>
  <div class="bars-legend">
    <span class="lg"><span class="sw" style="background:var(--accent)"></span>Equipamentos Produzidos (mês)</span>
    <span class="lg"><span class="sw" style="background:var(--ink)"></span>Aderência à Programação</span>
  </div>`;
}
function rankingProjetosHTML(ranking, kpi){
  if(!ranking || !ranking.length) return '<div class="empty-state">Sem projetos com previsto no período.</div>';
  const piores = ranking.slice(0,6);
  return `<div class="funnel">${piores.map(p=>{
    const n = nivel(p.pct,kpi);
    const cor = n?corNivel(n):'var(--ink-faint)';
    return `<div class="row">
      <div class="flabel" title="${p.nome}">${p.nome}</div>
      <div class="ftrack"><div class="ffill" style="width:${Math.min(100,p.pct)}%;background:${cor}"></div></div>
      <div class="fval" style="color:${cor}">${p.pct.toFixed(0)}%</div>
    </div>`;
  }).join("")}</div>`;
}
function semaforoProjetosHTML(ranking, kpi){
  if(!ranking || !ranking.length) return '<div class="empty-state">Sem projetos com previsto no período.</div>';
  const counts = {n1:0,n2:0,n3:0,n4:0};
  ranking.forEach(p=>{ const n = nivel(p.pct,kpi); if(n) counts[n]++; });
  const total = ranking.length;
  const ordem = ['n1','n2','n3','n4'];
  let acc = 0;
  const stops = ordem.map(k=>{
    const pct = total ? counts[k]/total*100 : 0;
    const start = acc; acc += pct;
    return `var(--${k}) ${start.toFixed(1)}% ${acc.toFixed(1)}%`;
  }).join(', ');
  return `
    <div class="semaforo-bar" style="background:${total?`linear-gradient(90deg, ${stops})`:'var(--line-soft)'}"></div>
    <div class="donut-legend" style="margin-top:12px;gap:6px">
      ${ordem.map(k=>`<div class="lg" style="font-size:11px"><span class="sw" style="background:var(--${k});width:9px;height:9px"></span>${k.toUpperCase()}<span class="pct" style="font-size:11px">${counts[k]} projeto${counts[k]!==1?'s':''}</span></div>`).join("")}
    </div>
    <div class="foot-note" style="margin-top:10px;margin-bottom:0;font-size:10px">${total} projetos com previsto no período, classificados pela mesma faixa da Aderência à Programação.</div>
  `;
}
function previstoRealizadoAcumSVG(prevArr, realArr, kpi, hojePos){
  const idxs = [];
  for(let i=0;i<12;i++){ if(prevArr[i]!=null) idxs.push(i); } // previsto (plano) cobre o ano inteiro, até dezembro
  if(!idxs.length) return '<div class="empty-state">Ainda sem histórico mensal de produção.</div>';

  const w=1000,h=230,P={l:56,r:26,t:30,b:34};
  const span = Math.max(1, idxs.length-1);
  const x = pos => P.l + (pos/span)*(w-P.l-P.r);

  const allVals = idxs.flatMap(i=>[prevArr[i],realArr[i]]).filter(v=>v!=null);
  const maxV = Math.max(...allVals,1)*1.12;
  const y = v => h-P.b - (v/maxV)*(h-P.t-P.b);

  let grid = '';
  for(let k=0;k<=3;k++){
    const v = maxV*k/3;
    const yy = y(v);
    grid += `<line x1="${P.l}" y1="${yy.toFixed(1)}" x2="${w-P.r}" y2="${yy.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    grid += `<text x="${P.l-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" fill="var(--ink-faint)" font-size="9.5">${Math.round(v)}</text>`;
  }
  const labels = idxs.map((mi,pos)=>`<text x="${x(pos).toFixed(1)}" y="${h-10}" text-anchor="middle" fill="var(--ink-faint)" font-size="9.5">${MESES_ORDEM[mi]}</text>`).join('');

  const prevPts = idxs.map((mi,pos)=>({pos,v:prevArr[mi]}));
  const prevPath = prevPts.map((p,i)=>`${i===0?'M':'L'}${x(p.pos).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const prevDots = prevPts.map(p=>`<circle cx="${x(p.pos).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="var(--ink-faint)" stroke="var(--panel)" stroke-width="1.5"/>`).join('');

  const realPts = idxs.map((mi,pos)=> realArr[mi]!=null?{pos,v:realArr[mi],mi}:null).filter(Boolean);
  const realPath = realPts.map((p,i)=>`${i===0?'M':'L'}${x(p.pos).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');

  // área entre previsto e realizado, só onde os dois existem (até "hoje") — vermelho = atrasado, verde = adiantado
  let areaSegs = '';
  for(let i=0;i<realPts.length-1;i++){
    const a = realPts[i], b = realPts[i+1];
    const pa = prevPts[a.pos], pb = prevPts[b.pos];
    if(!pa||!pb) continue;
    const atrasado = (a.v<=pa.v) || (b.v<=pb.v);
    const cor = atrasado ? 'var(--n1)' : 'var(--n4)';
    const seg = `M${x(a.pos).toFixed(1)},${y(a.v).toFixed(1)} L${x(b.pos).toFixed(1)},${y(b.v).toFixed(1)} L${x(b.pos).toFixed(1)},${y(pb.v).toFixed(1)} L${x(a.pos).toFixed(1)},${y(pa.v).toFixed(1)} Z`;
    areaSegs += `<path d="${seg}" fill="${cor}" opacity=".38"/>`;
  }

  const realDots = realPts.map((p,i)=>{
    const isFirst=i===0, isLast=i===realPts.length-1;
    const anchor = isFirst?'start':isLast?'end':'middle';
    const lx = isFirst?x(p.pos)+7:isLast?x(p.pos)-7:x(p.pos);
    const previsto = prevArr[p.mi];
    const pctMes = previsto>0 ? p.v/previsto*100 : null;
    const nv = pctMes!=null ? nivel(pctMes,kpi) : null;
    const cor = nv?corNivel(nv):'var(--accent)';
    const ring = isLast ? `<circle class="pulse-ring" cx="${x(p.pos).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="11" fill="none" stroke="var(--accent)" stroke-width="2"/>` : '';
    return `${ring}<circle cx="${x(p.pos).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${isLast?5:4}" fill="${cor}" stroke="var(--panel)" stroke-width="1.5"/>
      <text x="${lx.toFixed(1)}" y="${(y(p.v)-10).toFixed(1)}" text-anchor="${anchor}" fill="var(--ink)" font-size="9.5" font-weight="600">${Math.round(p.v)}</text>`;
  }).join('');

  let hojeLine = '';
  if(hojePos!=null){
    const hx = x(Math.max(idxs[0], Math.min(idxs[idxs.length-1], hojePos)));
    hojeLine = `<line x1="${hx.toFixed(1)}" y1="${P.t}" x2="${hx.toFixed(1)}" y2="${h-P.b}" stroke="var(--n2)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".9"/>
      <text x="${hx.toFixed(1)}" y="${P.t-10}" text-anchor="middle" fill="var(--n2)" font-size="10.5" font-weight="700">hoje</text>`;
  }

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    ${grid}
    ${areaSegs}
    ${hojeLine}
    <path d="${prevPath}" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-dasharray="5 4"/>
    ${prevDots}
    <path d="${realPath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${realDots}
    ${labels}
  </svg>
  <div class="bars-legend">
    <span class="lg"><span class="sw" style="background:var(--ink-faint)"></span>Previsto</span>
    <span class="lg"><span class="sw" style="background:var(--accent)"></span>Realizado</span>
    <span class="lg"><span class="sw" style="background:var(--n1);opacity:.5"></span>Área = atrasado</span>
    <span class="lg"><span class="sw" style="background:var(--n4);opacity:.5"></span>Área = adiantado</span>
  </div>`;
}

  const kpi = grp.kpis[0]; // Aderência à Programação
  document.getElementById('view-root').innerHTML = `
    ${topBarHTML('Painéis da área', 'Produção', null)}

function insightProducaoHTML(d, kpi){
  const pior = d.rankingProjetos && d.rankingProjetos[0];
  if(!pior) return '';

  if(n==='n3' || n==='n4' || !n) return '';
  const nGeral = nivel(kpi.recente, kpi);
  const peso = d.totalPrevisto>0 ? (pior.previsto/d.totalPrevisto*100) : null;
  return `<div class="insight-card" style="--bar:${corNivel(n)}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
    <div><b>${pior.nome}</b> está com apenas <b style="color:${corNivel(n)}">${pior.pct.toFixed(0)}%</b> de aderência${peso!=null?` e responde por <b>${peso.toFixed(0)}%</b> de todo o previsto da rede`:''} — é o principal responsável por puxar a Aderência geral para <b style="color:${nGeral?corNivel(nGeral):'var(--ink)'}">${nGeral?nGeral.toUpperCase():fmt(kpi.recente,kpi.unidade)}</b>.</div>
  </div>`;
}
function producaoDashboardHTML(kpi, d){
  const idxsDisponiveis = kpi.meses.map((v,i)=>v!=null?i:null).filter(i=>i!=null);
  const filtroHTML = filtroPeriodoAreaHTML(idxsDisponiveis, filtroProducaoDe, filtroProducaoAte, 'setFiltroProducaoDe', 'setFiltroProducaoAte');

  const periodoAtivo = filtroProducaoDe!=null;
  const de = filtroProducaoDe, ate = filtroProducaoAte!=null?filtroProducaoAte:filtroProducaoDe;
  const idxsPeriodo = periodoAtivo ? idxsDisponiveis.filter(i=>i>=de && i<=ate) : idxsDisponiveis;

  // gráfico de barras/aderência mensal respeita o filtro — fora do período vira null (some do gráfico).
  // O "Previsto vs Realizado" continua ano inteiro, pois é acumulado — não dá pra "recortar" um acumulado.
  const producaoMensalChart = periodoAtivo ? d.producaoMensal.map((v,i)=>idxsPeriodo.includes(i)?v:null) : d.producaoMensal;
  const mesesChart = periodoAtivo ? kpi.meses.map((v,i)=>idxsPeriodo.includes(i)?v:null) : kpi.meses;
  const charts = `
    <div class="panel" onclick="togglePanel(this)">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/></svg>Equipamentos produzidos vs. Aderência à Programação${EXPAND_IC}</h3>
      ${producaoStepSVG(producaoMensalChart, mesesChart, kpi)}
    </div>
    <div class="panel" onclick="togglePanel(this)" style="margin-top:14px">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>Previsto vs Realizado (ano inteiro)${EXPAND_IC}</h3>
      ${previstoRealizadoAcumSVG(d.previstoAcumMensalCompleto, d.realizadoAcumMensal, kpi, d.hojePos)}
    </div>
    <div class="panel" onclick="togglePanel(this)" style="margin-top:14px">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>Projetos atrasados (Real. &lt; Prev.)${EXPAND_IC}</h3>
      ${rankingProjetosHTML((d.rankingProjetos||[]).filter(p=>p.pct<100), kpi)}
    </div>
    <div class="foot-note">Dados calculados ao vivo a partir da planilha oficial de Aderência à Programação (FM.PRD.001), semana a semana. <a href="${(kpi.links&&kpi.links[0]&&kpi.links[0].url)||'#'}" target="_blank" style="color:var(--accent)">Abrir Cronograma completo ↗</a></div>
  `;

  if(periodoAtivo){
    const somar = arr => idxsPeriodo.reduce((s,i)=> arr[i]!=null ? s+arr[i] : s, 0);
    const produzido = idxsPeriodo.length ? somar(d.producaoMensal) : null;
    const previsto = idxsPeriodo.length ? somar(d.previstoMensal) : null;
    const aderencia = mediaMeses(idxsPeriodo.map(i=>kpi.meses[i])); // média das aderências dos meses do intervalo
    const gapPeriodo = (produzido!=null && previsto!=null) ? produzido-previsto : null;
    const nPeriodo = aderencia!=null ? nivel(aderencia,kpi) : null;
    const rotuloPeriodo = de===ate ? '' : ' no período';
    // último mês disponível ainda está em andamento (nem todas as semanas fecharam) — o Previsto
    // dele só soma as semanas já fechadas, senão o Gap comparado ficaria injusto (mês completo vs.
    // produção parcial). Avisa quando isso afeta o período selecionado, pra não parecer bug.
    const mesEmAndamento = ate === idxsDisponiveis[idxsDisponiveis.length-1];
    const kpiCardsMes = [
      { lbl:'Eq. Produzidos'+rotuloPeriodo, val: produzido!=null?Math.round(produzido).toLocaleString('pt-BR'):'–', cor:'var(--accent)',
        icon:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>' },
      { lbl:'Previsto'+rotuloPeriodo, val: previsto!=null?Math.round(previsto).toLocaleString('pt-BR'):'–', cor:'var(--ink-dim)',
        icon:'<path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/>' },
      { lbl:'Gap'+rotuloPeriodo, val: gapPeriodo==null?'–':(gapPeriodo>=0?'+':'')+Math.round(gapPeriodo).toLocaleString('pt-BR')+' un.', cor: gapPeriodo==null?'var(--accent)':gapPeriodo>=0?'var(--n4)':'var(--n1)',
        icon:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/><path d="M15 9h4v4"/>' },
      { lbl:'Aderência à Programação', val: fmt(aderencia,kpi.unidade), badge:nPeriodo, cor: nPeriodo?corNivel(nPeriodo):'var(--accent)',
        icon:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>' },
    ];
    return `
      ${filtroHTML}
      <div class="mi-kpis">
        ${kpiCardsMes.map(c=>`
          <div class="mi-kpi" style="--bar:${c.cor}">
            <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>${c.lbl}</div>
            <div class="val">${c.val}${c.badge?` <span class="tier-badge" style="background:${corNivel(c.badge)}">${c.badge.toUpperCase()}</span>`:''}</div>
          </div>`).join("")}
      </div>
      ${mesEmAndamento?`<div class="empty-state" style="border:1px dashed var(--n2);color:var(--ink);margin-bottom:14px;text-align:left;padding:12px 16px">
        <b style="color:var(--n2)">${MESES_ORDEM[ate]}/26 ainda está em andamento</b> — o Previsto mostrado é só das semanas já fechadas (até S${d.cutoff}), não o mês inteiro. Por isso o Gap compara produção parcial com previsto parcial, de forma justa.
      </div>`:''}
      ${charts}
    `;
  }

  const n = nivel(kpi.recente, kpi);
  const mesesComDado = d.producaoMensal.filter(v=>v!=null);
  const mediaMensal = mesesComDado.length ? d.totalProduzido/mesesComDado.length : null;
  const gap = (d.totalProduzido!=null && d.totalPrevisto!=null) ? d.totalProduzido - d.totalPrevisto : null;
  const gapTxt = gap==null ? '–' : (gap>=0?'+':'')+Math.round(gap).toLocaleString('pt-BR')+' un.';
  const gapCor = gap==null ? 'var(--accent)' : gap>=0 ? 'var(--n4)' : 'var(--n1)';

  const kpiCards = [
    { lbl:'Total Eq. Produzidos', val: d.totalProduzido!=null?Math.round(d.totalProduzido).toLocaleString('pt-BR'):'–', cor:'var(--accent)',
      icon:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>' },
    { lbl:'Aderência à Programação', val: fmt(kpi.recente,kpi.unidade), badge:n, cor: n?corNivel(n):'var(--accent)',
      icon:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>' },
    { lbl:'Gap (Real. − Prev.)', val: gapTxt, cor: gapCor,
      icon:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/><path d="M15 9h4v4"/>' },
    { lbl:'Média Eq. Produzidos/mês', val: mediaMensal!=null?Math.round(mediaMensal).toLocaleString('pt-BR'):'–', cor:'var(--accent)',
      icon:'<path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/>' },
    { lbl:'Semana de Pico', val: d.picoSemana?`${d.picoSemana} · ${Math.round(d.picoValor)} un.`:'–', cor:'var(--n4)',
      icon:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/><circle cx="19" cy="9" r="2"/>' },
  ];

  return `
    ${filtroHTML}
    <div class="mi-kpis">
      ${kpiCards.map(c=>`
        <div class="mi-kpi" style="--bar:${c.cor}">
          <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>${c.lbl}</div>
          <div class="val">${c.val}${c.badge?` <span class="tier-badge" style="background:${corNivel(c.badge)}">${c.badge.toUpperCase()}</span>`:''}</div>
        </div>`).join("")}
    </div>
    ${insightProducaoHTML(d, kpi)}
    ${charts}
  `;
}

function labelBaseParaMapa(bs){
  if(bs.length===1) return bs[0].base.replace('Base ','');
  // mais de uma base no mesmo estado (ex.: Cascavel - Consórcio / Cascavel - EPR) — usa a cidade em
  // comum se todas compartilharem o mesmo prefixo, senão cai pra sigla do estado como último recurso
  const prefixos = [...new Set(bs.map(b=>b.base.replace('Base ','').split(' - ')[0].trim()))];
  return prefixos.length===1 ? prefixos[0] : bs.map(b=>b.base.replace('Base ','')).join(' / ');
}
function mapaBrasilHTML(bases, kpi, valorFn){
  valorFn = valorFn || (b=>b.ns);
  const porUF = {};
  bases.forEach(b=>{ if(b.uf){ (porUF[b.uf]=porUF[b.uf]||[]).push(b); } });
  const ordem = {n1:1,n2:2,n3:3,n4:4};

  let paths = '', marks = '';
  for(const [uf, st] of Object.entries(BR_STATES)){
    const bs = porUF[uf];
    let fill = 'var(--line)', op = 0.5;
    if(bs){
      const niveis = bs.map(b=>nivel(valorFn(b),kpi)).filter(Boolean);
      const pior = niveis.length ? niveis.reduce((a,b2)=>ordem[a]<=ordem[b2]?a:b2) : null;
      fill = pior ? corNivel(pior) : 'var(--ink-faint)';
      op = 0.92;
    }
    paths += `<path class="uf${bs?' hasbase':''}" data-uf="${uf}" d="${st.d}" fill="${fill}" style="opacity:${op}"></path>`;
    if(bs){
      marks += `<circle class="mk" cx="${st.cx}" cy="${st.cy}" r="3.4"></circle>`;
      marks += `<text class="mklbl" x="${st.cx}" y="${st.cy-6}" text-anchor="middle">${labelBaseParaMapa(bs)}</text>`;
    }
  }

  return `<div class="mapbox">
    <svg id="brmap" viewBox="${BR_VIEWBOX}">${paths}${marks}</svg>
    <div class="legend" style="margin-top:10px">
      <span class="lg"><span class="sw" style="background:var(--n1)"></span>N1</span>
      <span class="lg"><span class="sw" style="background:var(--n2)"></span>N2</span>
      <span class="lg"><span class="sw" style="background:var(--n3)"></span>N3</span>
      <span class="lg"><span class="sw" style="background:var(--n4)"></span>N4</span>
      <span style="color:var(--ink-faint);margin-left:8px">· cinza = sem base</span>
    </div>
    <div class="map-tip" id="map-tip"></div>
  </div>`;
}
function initMapTooltip(d, kpi, valorFn){
  valorFn = valorFn || (b=>b.ns);
  const map = document.getElementById('brmap');
  const tip = document.getElementById('map-tip');
  if(!map || !tip) return;
  const porUF = {};
  d.bases.forEach(b=>{ if(b.uf){ (porUF[b.uf]=porUF[b.uf]||[]).push(b); } });
  map.querySelectorAll('path.hasbase').forEach(p=>{
    p.addEventListener('mousemove', e=>{
      const uf = p.dataset.uf, bs = porUF[uf];
      const nomeEstado = BR_STATES[uf] ? BR_STATES[uf].estado : uf;
      tip.innerHTML = `<b>${nomeEstado} (${uf})</b>` + bs.map(b=>{
        const val = valorFn(b);
        const n = nivel(val,kpi);
        return `<div class="r"><span>${b.base.replace('Base ','')}</span><b style="color:${n?corNivel(n):'var(--ink-faint)'}">${val!=null?val.toFixed(1)+'%':'–'}${n?' · '+n.toUpperCase():''}</b></div>
          <div class="r" style="opacity:.7;font-size:10.5px"><span>Atendimento</span><span>${b.ns!=null?b.ns.toFixed(1)+'%':'–'}</span></div>`;
      }).join('');
      const r = map.getBoundingClientRect();
      let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
      if(x > r.width - 170) x = e.clientX - r.left - 170;
      tip.style.left = x+'px'; tip.style.top = y+'px'; tip.style.opacity = 1;
    });
    p.addEventListener('mouseleave', ()=> tip.style.opacity = 0);
  });
}

      icon:'<path d="M21 8V5a1 1 0 0 0-.5-.87l-7.5-4.3a2 2 0 0 0-2 0L3.5 4.13A1 1 0 0 0 3 5v14a1 1 0 0 0 .5.87l7.5 4.3a2 2 0 0 0 2 0"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>' },

      icon:'<path d="M3 21V7l9-4 9 4v14"/><path d="M3 21h18"/>' },
  ];

  const maxRuptura = Math.max(...d.bases.map(b=>b.rupturaBase||0), 1);

      <div class="fval" style="color:${cor}">${b.rupturaBase!=null?b.rupturaBase.toFixed(1)+'%':'–'}</div>
    </div>`;
  }).join("")}</div>`;

  const tableRows = [...d.bases].sort((a,b)=>(a.rupturaBase==null?999:a.rupturaBase)-(b.rupturaBase==null?999:b.rupturaBase)).map(b=>{
    const n = nivel(b.rupturaBase,kpiRupt);
    const cor = n?corNivel(n):'var(--ink-faint)';

      <td class="name">${b.base}</td>
      <td class="num dim">${b.uf||'—'}</td>

      <td class="num dim">${b.acuraciaBase!=null?b.acuraciaBase.toFixed(1)+'%':'–'}</td>
      <td class="num dim">${fic?'R$ '+Math.round(fic.valor/1000)+'k':'–'}</td>
      <td class="num" style="color:${corVar}">${fic?(fic.variacao>=0?'+':'')+fic.variacao.toFixed(1)+'%':'–'}</td>

  return `
    <div class="mi-kpis">
      ${kpiCards.map(c=>`

          <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>${c.lbl}</div>
          <div class="val">${c.val}${c.badge?` <span class="tier-badge" style="background:${corNivel(c.badge)}">${c.badge.toUpperCase()}</span>`:''}</div>
        </div>`).join("")}
    </div>
    <div class="mi-panels">
      <div class="panel" style="cursor:default"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-5.5 2.5V6L9 3.5m0 16.5 6 2.5m-6-2.5V3.5m6 19 5.5-2.5V3L15 5.5m0 17V5.5m0 0L9 3.5"/></svg>Ruptura por base (mapa)</h3>${mapaBrasilHTML(d.bases,kpiRupt,b=>b.rupturaBase)}</div>
      <div class="panel" onclick="togglePanel(this)"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/></svg>Ranking de bases (ruptura)${EXPAND_IC}</h3>${rankingHTML}</div>
    </div>
    <div class="empty-state" style="border:1px dashed var(--n2);color:var(--ink);margin-bottom:14px">
      <b style="color:var(--n2)">Valor do Estoque (R$) e Variação são fictícios</b>
    </div>
    <div class="tablewrap">
      <div class="scroll">
        <table>
          <thead><tr><th class="name">Base</th><th>UF</th><th>Ruptura</th><th>Nível</th><th>Atendimento</th><th>Acuracidade</th><th>Valor Estoque (R$)*</th><th>Variação*</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
      <div class="foot">${legendHTML()}<div>${d.bases.length} bases</div></div>
    </div>
    <div class="foot-note">Dados calculados ao vivo a partir da planilha semanal de balanço de estoque das filiais. * Valor do Estoque e Variação são fictícios, aguardando fonte real. <a href="${FILIAIS_SHEET_URL}" target="_blank" style="color:var(--accent)">Abrir planilha completa ↗</a></div>
  `;
}

function donutGenericoHTML(entries, centerLabel){
  const total = entries.reduce((s,e)=>s+e.val,0);
  let acc = 0;
  const stops = entries.map(e=>{
    const pct = total ? e.val/total*100 : 0;
    const start = acc; acc += pct;
    return `${e.cor} ${start.toFixed(1)}% ${acc.toFixed(1)}%`;
  }).join(', ');
  return `<div class="donut-wrap">
    <div class="donut" style="background:${total?`conic-gradient(${stops})`:'var(--line-soft)'}">
      <div class="d-center"><b>${total}</b><span>${centerLabel}</span></div>
    </div>
    <div class="donut-legend">
      ${entries.map(e=>`<div class="lg"><span class="sw" style="background:${e.cor}"></span>${e.label}<span class="pct">${e.val} · ${total?Math.round(e.val/total*100):0}%</span></div>`).join("")}
    </div>
  </div>`;
}

function acuraciaLineSVG(meses, meta){
  const w=1000,h=230,P={l:50,r:26,t:24,b:34};
  const vals = meses.map(m=>m.acuracia);
  let lo = Math.min(...vals, meta), hi = Math.max(...vals, meta);
  const pad = (hi-lo)*0.3 || 5; lo -= pad; hi += pad*0.35; if(hi>100) hi=100.5;
  const x = i => P.l + (i/(meses.length-1))*(w-P.l-P.r);
  const y = v => P.t + (hi-v)/((hi-lo)||1)*(h-P.t-P.b);

  let grid = '';
  for(let k=0;k<=3;k++){
    const v = lo+(hi-lo)*k/3;
    const yy = y(v);
    grid += `<line x1="${P.l}" y1="${yy.toFixed(1)}" x2="${w-P.r}" y2="${yy.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    grid += `<text x="${P.l-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" fill="var(--ink-faint)" font-size="9.5">${v.toFixed(1)}%</text>`;
  }
  const labels = meses.map((m,i)=>{
    const isGeral = m.tipo==='Geral';
    return `<text x="${x(i).toFixed(1)}" y="${h-10}" text-anchor="middle" fill="${isGeral?'var(--accent)':'var(--ink-faint)'}" font-weight="${isGeral?700:400}" font-size="9.5">${m.mes}${isGeral?' ●':''}</text>`;
  }).join('');

  const ym = y(meta);
  const metaLine = `<line x1="${P.l}" y1="${ym.toFixed(1)}" x2="${w-P.r}" y2="${ym.toFixed(1)}" stroke="var(--n2)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".9"/>
    <text x="${w-P.r}" y="${(ym-6).toFixed(1)}" text-anchor="end" fill="var(--n2)" font-size="9.5" font-weight="600">Meta N4</text>`;

  const path = meses.map((m,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(m.acuracia).toFixed(1)}`).join(' ');
  const areaBottom=(h-P.b).toFixed(1);
  const area = `${path} L${x(meses.length-1).toFixed(1)},${areaBottom} L${x(0).toFixed(1)},${areaBottom} Z`;

  const dots = meses.map((m,i)=>{
    const isGeral = m.tipo==='Geral';
    const good = m.acuracia>=meta;
    const cor = good?'var(--n4)':'var(--n1)';
    const r = isGeral?6:3.5;
    const ring = isGeral?`<circle class="pulse-ring" cx="${x(i).toFixed(1)}" cy="${y(m.acuracia).toFixed(1)}" r="${r+3}" fill="none" stroke="var(--accent)" stroke-width="2"/>`:'';
    return `${ring}<circle cx="${x(i).toFixed(1)}" cy="${y(m.acuracia).toFixed(1)}" r="${r}" fill="${cor}" stroke="var(--panel)" stroke-width="1.5"/>
      <text x="${x(i).toFixed(1)}" y="${(y(m.acuracia)-11).toFixed(1)}" text-anchor="middle" fill="var(--ink)" font-size="9.5" font-weight="${isGeral?700:600}">${m.acuracia.toFixed(1)}%</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="estGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#estGrad)"/>
    ${metaLine}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${labels}
  </svg>`;
}

  const totC=enr.reduce((s,m)=>s+m.contados,0), totD=enr.reduce((s,m)=>s+m.divergencias,0);

    <div class="sec-head" style="margin-top:0"><div class="sec-n" style="background:var(--n4)">1</div><h2>Acurácia de Estoque</h2><span class="sec-d">contagens cíclicas mensais + inventário geral em dezembro</span></div>
    <div class="mi-kpis">
      ${cards.map(c=>`
        <div class="mi-kpi" style="--bar:${c.cor}">
          <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>${c.lbl}</div>
          <div class="val">${c.val}</div>

    <div class="panel" onclick="togglePanel(this)">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>Evolução da acurácia (%)${EXPAND_IC}</h3>
      ${acuraciaLineSVG(enr, D.meta)}
    </div>
    <div class="tablewrap" style="margin-top:14px">

   Prioridade, Status, Observações. Dados reais ao vivo — sem KPI
   oficial atrelado na Matriz de Metas (mesmo caso do Estoque).

const PLANO_ACAO_SHEET_ID = '1k2QpjUZZcOjlTQZMZ_nGYB6NgAupo0QJFqaTng5tQWQ';
const PLANO_ACAO_SHEET_URL = `https://docs.google.com/spreadsheets/d/${PLANO_ACAO_SHEET_ID}/edit`;
const PLANO_ACAO_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbw57FhK0aU7IV-L02PcO9DTT9z-F5DwGXj91v85HCx7UD0y7EhpNtJ6M3idJdGvLsNTWw/exec';
const PLANO_ACAO_ABAS = ['Produção', 'Estoque & Logística'];
const STATUS_COR_PLANO = {
  'Proposta':'var(--ink-faint)', 'A iniciar':'var(--n2)', 'Em andamento':'var(--accent)',
  'Concluído':'var(--n4)', 'Atrasado':'var(--n1)', 'Cancelado':'var(--ink-faint)',
};
const PRIORIDADE_OPCOES_PLANO = ['Alta','Média','Baixa'];

function salvarCampoPlanoAcao(nomeAba, num, field, value, el){
  if(!PLANO_ACAO_WEBAPP_URL){
    el.style.outline = '2px solid var(--n2)';
    el.title = 'Ainda não conectado à planilha (Apps Script pendente de implantação).';
    setTimeout(()=>{ el.style.outline=''; }, 1500);
    return;
  }
  fetch(PLANO_ACAO_WEBAPP_URL, {method:'POST', body: JSON.stringify({sheet:nomeAba, num, field, value})})
    .then(r=>r.json())
    .then(res=>{
      el.style.outline = res.ok ? '2px solid var(--n4)' : '2px solid var(--n1)';
      if(!res.ok) console.error('Erro ao salvar Plano de Ação:', res.error);
      setTimeout(()=>{ el.style.outline=''; }, 1200);
    })
    .catch(e=>{
      console.error('Erro de conexão ao salvar Plano de Ação:', e);
      el.style.outline = '2px solid var(--n1)';
      setTimeout(()=>{ el.style.outline=''; }, 1200);
    });
}

    <option value="" ${!atual?'selected':''}>–</option>
