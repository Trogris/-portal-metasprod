let dadosPlanoAcao = null;
let dadosPlanoAcaoPromise = null;
function getDadosPlanoAcao(){
  if(dadosPlanoAcao) return Promise.resolve(dadosPlanoAcao);
  if(!dadosPlanoAcaoPromise) dadosPlanoAcaoPromise = calcularDadosPlanoAcao().then(d=>{ dadosPlanoAcao = d; return d; }).catch(e=>{ dadosPlanoAcaoPromise = null; throw e; });
  return dadosPlanoAcaoPromise;
}

function fmtDataGviz(v){
  if(v==null) return null;
  const m = /^Date\((\d+),(\d+),(\d+)\)$/.exec(String(v));
  if(!m) return String(v);
  const [, ano, mes, dia] = m;
  return `${dia.padStart(2,'0')}/${(parseInt(mes,10)+1).toString().padStart(2,'0')}/${ano}`;
}
async function calcularDadosPlanoAcao(){
  const results = await Promise.all(PLANO_ACAO_ABAS.map(nome=>fetchGvizJSON(PLANO_ACAO_SHEET_ID, nome)));
  const areas = PLANO_ACAO_ABAS.map((nome, i)=>{
    const json = results[i];
    const rows = (json.table.rows||[]).map(r=>{
      const c = r.c||[];
      const v = idx => (c[idx] && c[idx].v!=null) ? c[idx].v : null;
      return {
        num: v(0), tema: v(1), acao: v(2), objetivo: v(3),
        responsavel: v(4), prazo: fmtDataGviz(v(5)), prioridade: v(6), status: v(7)||'—', obs: v(8),
      };
    }).filter(r=>r.acao);
    return { nome, acoes: rows };
  });

  const todas = areas.flatMap(a=>a.acoes);
  const porStatus = {};
  todas.forEach(a=>{ porStatus[a.status] = (porStatus[a.status]||0)+1; });

  return { areas, todas, porStatus };
}

    ${d.areas.map((area,i)=>secaoPlanoAreaHTML(area, i+1, coresArea[i]||'var(--accent)')).join('<hr class="sec-sep">')}
    <div class="foot-note">Dados ao vivo da planilha "Plano de Ação Operacional". <a href="${PLANO_ACAO_SHEET_URL}" target="_blank" style="color:var(--accent)">Abrir planilha completa ↗</a></div>
  `;
}

function viewPlanoAcao(){
  document.getElementById('view-root').innerHTML = `
    ${topBarHTML('Painéis da área', 'Plano de Ação', null)}
    <div id="plano-acao-dash">${dadosPlanoAcao ? planoAcaoDashboardHTML(dadosPlanoAcao) : '<div class="mi-loading">Carregando plano de ação…</div>'}</div>
  `;
  if(!dadosPlanoAcao){
    getDadosPlanoAcao().then(d=>{
      if(currentView === 'Plano de Ação'){
        const el = document.getElementById('plano-acao-dash');
        if(el) el.innerHTML = planoAcaoDashboardHTML(d);
      }
    }).catch(e=>{
      console.error('Erro ao buscar Plano de Ação:', e);
      const el = document.getElementById('plano-acao-dash');
      if(el) el.innerHTML = '<div class="empty-state">Não foi possível carregar os dados agora. Tente novamente em instantes.</div>';
    });
  }
}

/* =====================================================================
   LOGÍSTICA — Custo por Rota. Ainda sem fonte de dados conectada;
   modelo com dados fictícios (mesmo caso do Estoque, autorizado pelo
   usuário) só pra mostrar o layout, baseado no template que o usuário
   passou (logistica-rotas.html). Troca DADOS_LOGISTICA_EXEMPLO por uma
   busca real quando a fonte chegar. Contrato de dados por rota: rota,
   origem, destino, dist (km), entregas, custo, margem (%) — custo/km,
   custo/entrega e faixa de margem são calculados aqui no front.
   ===================================================================== */
const DADOS_LOGISTICA_EXEMPLO = {
  meta_custo_km: 10.0,
  tendencia: {
    labels:["Ago","Set","Out","Nov","Dez","Jan","Fev","Mar","Abr","Mai","Jun","Jul"],

    {rota:"RTA-001", origem:"Curitiba - PR", destino:"Joinville - SC", dist:181, entregas:16, custo:1892.10, margem:19.9},
    {rota:"RTA-002", origem:"Curitiba - PR", destino:"Florianópolis - SC", dist:300, entregas:20, custo:3145.00, margem:17.2},
    {rota:"RTA-003", origem:"São Paulo - SP", destino:"Campinas - SP", dist:99, entregas:18, custo:1247.90, margem:24.5},
    {rota:"RTA-004", origem:"São Paulo - SP", destino:"Ribeirão Preto - SP", dist:313, entregas:25, custo:2987.40, margem:18.7},
    {rota:"RTA-005", origem:"São Paulo - SP", destino:"Belo Horizonte - MG", dist:586, entregas:32, custo:5876.30, margem:15.3},
    {rota:"RTA-006", origem:"São Paulo - SP", destino:"Sorocaba - SP", dist:87, entregas:14, custo:1043.20, margem:26.2},
    {rota:"RTA-007", origem:"São Paulo - SP", destino:"Santos - SP", dist:78, entregas:12, custo:912.60, margem:22.1},
    {rota:"RTA-008", origem:"Porto Alegre - RS", destino:"Caxias do Sul - RS", dist:125, entregas:15, custo:1317.80, margem:21.8},
  ],
};

const CLASSES_MARGEM = {Alta:'var(--n4)', Média:'var(--n2)', Baixa:'var(--n1)'};
function faixaMargem(m){ return m>=20?'Alta':m>=10?'Média':'Baixa'; }

function custoKmLineSVG(labels, valores, meta){
  const w=1000,h=230,P={l:50,r:26,t:24,b:34};
  let lo = Math.min(...valores, meta), hi = Math.max(...valores, meta);
  const pad = (hi-lo)*0.3 || 1; lo -= pad; hi += pad*0.35;
  const x = i => P.l + (i/(labels.length-1))*(w-P.l-P.r);
  const y = v => P.t + (hi-v)/((hi-lo)||1)*(h-P.t-P.b);

  let grid = '';
  for(let k=0;k<=3;k++){
    const v = lo+(hi-lo)*k/3;
    const yy = y(v);
    grid += `<line x1="${P.l}" y1="${yy.toFixed(1)}" x2="${w-P.r}" y2="${yy.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    grid += `<text x="${P.l-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" fill="var(--ink-faint)" font-size="9.5">R$ ${v.toFixed(2)}</text>`;
  }
  const labelsSvg = labels.map((lb,i)=>`<text x="${x(i).toFixed(1)}" y="${h-10}" text-anchor="middle" fill="var(--ink-faint)" font-size="9.5">${lb}</text>`).join('');

  const ym = y(meta);
  const metaLine = `<line x1="${P.l}" y1="${ym.toFixed(1)}" x2="${w-P.r}" y2="${ym.toFixed(1)}" stroke="var(--n2)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".9"/>
    <text x="${w-P.r}" y="${(ym-6).toFixed(1)}" text-anchor="end" fill="var(--n2)" font-size="9.5" font-weight="600">Meta N4</text>`;

  const path = valores.map((v,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const areaBottom=(h-P.b).toFixed(1);
  const area = `${path} L${x(labels.length-1).toFixed(1)},${areaBottom} L${x(0).toFixed(1)},${areaBottom} Z`;

  const dots = valores.map((v,i)=>{
    const cor = v<=meta?'var(--n4)':'var(--n1)';
    const isLast = i===valores.length-1;
    const ring = isLast ? `<circle class="pulse-ring" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="9" fill="none" stroke="var(--accent)" stroke-width="2"/>` : '';
    return `${ring}<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="${cor}" stroke="var(--panel)" stroke-width="1.5"/>
      <text x="${x(i).toFixed(1)}" y="${(y(v)-11).toFixed(1)}" text-anchor="middle" fill="var(--ink)" font-size="9.5" font-weight="600">R$ ${v.toFixed(2)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="custoKmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#custoKmGrad)"/>
    ${metaLine}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${labelsSvg}
  </svg>`;
}

function secaoCustoRotaHTML(D){
  const rotas = D.rotas.map(r=>({...r, custoKm:r.custo/r.dist, custoEntrega:r.custo/r.entregas, faixa:faixaMargem(r.margem)}));
  const custoTot = rotas.reduce((s,r)=>s+r.custo,0);
  const kmTot = rotas.reduce((s,r)=>s+r.dist,0);
  const entTot = rotas.reduce((s,r)=>s+r.entregas,0);
  const custoKmMedio = custoTot/kmTot;
  const custoEntregaMedio = custoTot/entTot;
  const margemMedia = rotas.reduce((s,r)=>s+r.margem*r.custo,0)/custoTot;

  const cards = [
    { lbl:'Custo total do período', val:'R$ '+Math.round(custoTot).toLocaleString('pt-BR'), sub:`${rotas.length} rotas · ${entTot} entregas`, cor:'var(--accent)',
      icon:'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' },
    { lbl:'Custo médio por km', val:'R$ '+custoKmMedio.toFixed(2), sub:`meta ≤ R$ ${D.meta_custo_km.toFixed(2)}`, cor: custoKmMedio<=D.meta_custo_km?'var(--n4)':'var(--n1)',
      icon:'<path d="M1 3h15v13H1z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>' },
    { lbl:'Custo médio por entrega', val:'R$ '+custoEntregaMedio.toFixed(2), sub:`${entTot} entregas no período`, cor:'var(--n2)',
      icon:'<path d="M21 8V5l-9-4-9 4v14l9 4 9-4"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>' },
    { lbl:'Margem média', val: margemMedia.toFixed(1)+'%', sub:'ponderada por custo', cor: margemMedia>=20?'var(--n4)':margemMedia>=10?'var(--n2)':'var(--n1)',
      icon:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>' },
  ];

  const rank = [...rotas].sort((a,b)=>b.custo-a.custo);
  const maxC = Math.max(...rank.map(r=>r.custo));
  const rankingHTML = `<div class="funnel">${rank.map(r=>{
    const cor = CLASSES_MARGEM[r.faixa];
    return `<div class="row">
      <div class="flabel" title="${r.origem} → ${r.destino}">${r.rota}</div>
      <div class="ftrack"><div class="ffill" style="width:${r.custo/maxC*100}%;background:${cor}"></div></div>
      <div class="fval" style="color:${cor}">R$ ${Math.round(r.custo).toLocaleString('pt-BR')}</div>
    </div>`;
  }).join("")}</div>`;

  const counts = {Alta:0,Média:0,Baixa:0}; rotas.forEach(r=>counts[r.faixa]++);
  const donutHTMLMargem = donutGenericoHTML([
    {label:'Alta (≥20%)', val:counts.Alta, cor:CLASSES_MARGEM.Alta},
    {label:'Média (10–20%)', val:counts.Média, cor:CLASSES_MARGEM.Média},
    {label:'Baixa (<10%)', val:counts.Baixa, cor:CLASSES_MARGEM.Baixa},
  ], 'rotas');

  const rows = [...rotas].sort((a,b)=>a.margem-b.margem).map(r=>{
    const cor = CLASSES_MARGEM[r.faixa];
    return `<tr>
      <td class="name">${r.rota}<span class="pend-tag" style="border-color:transparent;color:var(--ink-faint)">${r.origem} → ${r.destino}</span></td>
      <td class="num dim">${r.dist} km</td>
      <td class="num dim">${r.entregas}</td>
      <td class="num">R$ ${r.custo.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td class="num" style="color:${r.custoKm<=D.meta_custo_km?'var(--n4)':'var(--n1)'}">R$ ${r.custoKm.toFixed(2)}</td>
      <td class="num">R$ ${r.custoEntrega.toFixed(2)}</td>
      <td class="desemp" style="color:${cor}">${r.margem.toFixed(1)}%</td>
    </tr>`;
  }).join("");

  return `
    <div class="sec-head" style="margin-top:0"><div class="sec-n" style="background:var(--accent)">1</div><h2>Custo por Rota</h2><span class="sec-d">custo por km, custo por entrega e margem — meta de custo/km ≤ R$ ${D.meta_custo_km.toFixed(2)}</span></div>
    <div class="mi-kpis">
      ${cards.map(c=>`
        <div class="mi-kpi" style="--bar:${c.cor}">
          <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>${c.lbl}</div>
          <div class="val">${c.val}</div>
          <div class="sub" style="font-size:10.5px;color:var(--ink-faint);margin-top:2px">${c.sub}</div>
        </div>`).join("")}
    </div>
    <div class="mi-panels">
      <div class="panel" onclick="togglePanel(this)">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/></svg>Custo total por rota (R$)${EXPAND_IC}</h3>
        ${rankingHTML}
      </div>
      <div class="panel" onclick="togglePanel(this)">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>Rotas por faixa de margem${EXPAND_IC}</h3>
        ${donutHTMLMargem}
      </div>
    </div>
    <div class="panel" onclick="togglePanel(this)">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>Evolução do custo por km (R$)${EXPAND_IC}</h3>
      ${custoKmLineSVG(D.tendencia.labels, D.tendencia.custo_km, D.meta_custo_km)}
    </div>
    <div class="tablewrap" style="margin-top:14px">
      <div class="scroll">
        <table>
          <thead><tr><th class="name">Rota</th><th>Dist.</th><th>Entregas</th><th>Custo total</th><th>Custo/km</th><th>Custo/entrega</th><th>Margem</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="foot"><div>${rotas.length} rotas · ${kmTot} km · ${entTot} entregas</div><div>Total: R$ ${custoTot.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})} · Margem média: ${margemMedia.toFixed(1)}%</div></div>
    </div>
  `;
}

function viewLogisticaMatriz(){
  // Área ainda não liberada — não mostra o modelo fictício, só o aviso de "em construção".
  document.getElementById('view-root').innerHTML = `
    ${topBarHTML('Painéis da área', 'Logística', null)}
    <div class="empty-state" style="padding:64px 24px">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--n2)" stroke-width="1.6" style="width:40px;height:40px;margin-bottom:14px"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      <div style="color:var(--ink);font-size:15px;font-weight:700">Painel em construção</div>
    </div>
  `;
}

function renderCards(areas){
  const el = document.getElementById("cards");
  if(!el) return;
  el.innerHTML = areas.map(a=>{
    const carregando = carregandoAreas.has(a.area);
    const valHTML = a.nivel
      ? `${fmt(valorEfetivo(a.kpiRef),a.kpiRef.unidade)} <span class="tier-badge" style="background:${corNivel(a.nivel)}">${a.nivel.toUpperCase()}</span>`
      : carregando
        ? `<span style="font-size:13px;color:var(--ink-faint);font-weight:500"><span class="card-spinner"></span>Carregando…</span>`
        : `<span style="font-size:14px;color:var(--ink-faint);font-weight:500">Pendente</span>`;
    const subHTML = a.nivel ? a.kpiRef.nome : (carregando ? 'buscando dado na planilha…' : 'nenhum indicador conectado ainda');
    const tooltip = a.kpiRef ? `Faixas de nível — ${a.kpiRef.nome}:\n${faixasTooltipTexto(a.kpiRef)}` : '';
    return `
    <div class="card" style="--bar:${a.cor}" title="${tooltip.replace(/"/g,'&quot;')}">
      <div class="lbl">${areaIcon(a.area,true)}${a.area}</div>
      <div class="val">${valHTML}</div>
      <div class="sub">${subHTML}</div>
    </div>`;
  }).join("");
}

function areaIcon(area,small){
  const s = small?'width="13" height="13"':'width="15" height="15"';
  const map={
    "Produção":`<path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4l-6 5Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/>`,
    "Manutenção Interna":`<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.1 2.1-2-2 2.1-2.1z"/>`,
    "Filiais":`<path d="M21 8V5l-9-4-9 4v14l9 4 9-4"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>`,
    "Estoque":`<path d="M3 9h18M3 9v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9M3 9l2-5h14l2 5"/><path d="M9 13h6"/>`,
    "Logística":`<path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>`,
    "Plano de Ação":`<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2h-4"/><path d="M9 12h6M9 16h6"/>`,
  };
  return `<svg viewBox="0 0 24 24" ${s} fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px">${map[area]||""}</svg>`;
}

// áreas cuja busca na planilha ainda está em andamento — controla o "Carregando…" nos cards
const carregandoAreas = new Set(METAS.map(m=>m.area));

async function init(){
  if(sidebarCollapsed) document.getElementById('sidebar').classList.add('collapsed');
  render(); // primeiro render com tudo carregando, pra tela não ficar em branco

  getDadosProducao().then(({atual,meses})=>{
    const kpi = METAS[0].kpis[0];
    kpi.meses = meses;
    kpi.recente = atual; // valor mais recente — usado só na própria página de Produção
    kpi.atual = mediaMeses(meses); // Realizado (Visão Consolidada/Matriz) = média dos meses já postados no ano
  }).catch(e=>console.error('Erro ao buscar Aderência à Programação:', e))
    .finally(()=>{ carregandoAreas.delete('Produção'); render(); });

  getDadosMI().then(d=>{
    const kpi = METAS[1].kpis[0];
    kpi.meses = d.estoque.meses;
    kpi.recente = d.estoque.atual; // saldo mais recente — usado só na própria página de MI
    kpi.atual = mediaMeses(d.estoque.meses);
  }).catch(e=>console.error('Erro ao buscar dados de Manutenção Interna:', e))
    .finally(()=>{ carregandoAreas.delete('Manutenção Interna'); render(); });

  getDadosEstoqueMatriz().then(d=>{
    const kpi = METAS[2].kpis[0];
    kpi.meses = d.meses;
    kpi.recente = d.atual;
    kpi.atual = mediaMeses(d.meses);
  }).catch(e=>console.error('Erro ao buscar dados de Acuracidade do Estoque:', e))
    .finally(()=>{ carregandoAreas.delete('Estoque'); render(); });

  getDadosFiliais().then(d=>{
    // A acuracidade por base (planilha de Filiais) é só um detalhe operacional dentro
    // da própria aba Filiais (KPI_ACURACIDADE_FILIAL) — não entra na Visão Consolidada.
    // O indicador oficial "Acuracidade do Estoque" da Matriz de Metas vem da planilha
    // do CD (getDadosEstoqueMatriz, acima). Aqui só entra Ruptura (Filiais).
    const kRupt = METAS[3].kpis[0];
    d.rupturaMensal.forEach((v,i)=>{ if(v!=null) kRupt.meses[i] = v; });
    kRupt.recente = d.ruptura;
    kRupt.atual = mediaMeses(kRupt.meses);
  }).catch(e=>console.error('Erro ao buscar dados das Filiais:', e))
    .finally(()=>{ carregandoAreas.delete('Filiais'); render(); });
}
init();
</script>
